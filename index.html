          if (!rc || !rc.username) return;
          const key = String(rc.username).toLowerCase();
          const existing = map.get(key);
          if (!existing || Number(rc.updatedAt || 0) >= Number(existing.updatedAt || 0)) {
            map.set(key, rc);
          }
        });
        return Array.from(map.values());
      }

      function applyIncomingRealtimeData(data) {
        if (!data || !Array.isArray(data.products) || data.products.length === 0) return;
        const incomingTs = Number(data.updatedAt || 0);
        if (incomingTs && incomingTs <= lastSyncedTimestamp) return;
        lastSyncedTimestamp = incomingTs || Date.now();
        localStorage.setItem('alpaca_last_live_ts', String(lastSyncedTimestamp));

        state.products = normalizeProductsPlatforms(data.products);
        if (Array.isArray(data.platforms) && data.platforms.length > 0) state.platforms = data.platforms;
        if (Array.isArray(data.registeredClients)) {
          state.registeredClients = mergeClientsList(state.registeredClients, data.registeredClients);
          // Si el cliente tiene su sesión abierta en este dispositivo, mantener sincronizado su propio backoffice/perfil
          if (state.loggedClient) {
            const updatedSelf = state.registeredClients.find(
              (c) => String(c.username || '').toLowerCase() === String(state.loggedClient.username || '').toLowerCase()
            );
            if (updatedSelf) {
              state.loggedClient = Object.assign({}, state.loggedClient, updatedSelf);
            }
          }
        }
        if (data.config) state.config = Object.assign({}, state.config, data.config, { partners: state.config.partners });
        saveLocal();
        if (state.activeTab !== 'admin' && state.activeTab !== 'perfil_cliente' && !state.isClientModalOpen) {
          render();
        }
      }

      async function fetchLiveCloudCatalog() {
        // 1. Leer primero Firebase en tiempo real (Instantáneo en menos de 1 segundo sin esperar caché de GitHub)
        try {
          const fbRes = await fetch('https://alpaca-digital-live-default-rtdb.firebaseio.com/stores/' + encodeURIComponent(activeCloudId) + '.json?t=' + Date.now(), {
            cache: 'no-store'
          });
          if (fbRes.ok) {
            const parsed = await fbRes.json();
            if (parsed && Array.isArray(parsed.products)) {
              cloudSyncStatus = 'online';
              applyIncomingRealtimeData(parsed);
            }
          }
        } catch (e) {}

        // 2. Leer catalog.json oficial del repositorio GitHub Pages evitando caché de CDN
        try {
          const localRepoRes = await fetch('./catalog.json?nocache=' + Date.now(), {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
          });
          if (localRepoRes.ok) {
            const repoData = await localRepoRes.json();
            if (repoData && Array.isArray(repoData.products)) {
              cloudSyncStatus = 'online';
              applyIncomingRealtimeData(repoData);
            }
          }
        } catch (e) {}
      }

      async function pushCatalogToGitHubLive() {
        state.products = normalizeProductsPlatforms(state.products);
        const nowTs = Date.now();
        lastSyncedTimestamp = nowTs;
        localStorage.setItem('alpaca_last_live_ts', String(nowTs));

        const payloadObj = {
          updatedAt: nowTs,
          config: state.config,
          platforms: state.platforms,
          products: state.products,
          registeredClients: state.registeredClients || []
        };

        try {
          if (liveSyncChannel) {
            liveSyncChannel.postMessage({ type: 'ALPACA_LIVE_UPDATE', payload: payloadObj });
          }
        } catch (e) {}

        // 1. Guardar en tiempo real en la nube abierta (PUT JSON sin límite de tamaño)
        try {
          const fbPut = await fetch('https://alpaca-digital-live-default-rtdb.firebaseio.com/stores/' + encodeURIComponent(activeCloudId) + '.json', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadObj)
          });
          if (fbPut.ok) {
            cloudSyncStatus = 'online';
          }
        } catch (e) {
          cloudSyncStatus = 'local';
        }

        // 2. Si configuraste tu Token de GitHub en la Pestaña 6, actualiza catalog.json directamente en tu repositorio
        const ghToken = localStorage.getItem(GH_TOKEN_KEY) || '';
        const ghRepo = localStorage.getItem(GH_REPO_KEY) || 'youalpac/TuAlpacaDigital';
        if (ghToken && ghRepo) {
          try {
            const apiUrl = 'https://api.github.com/repos/' + ghRepo.trim() + '/contents/catalog.json';
            let sha = undefined;
            const getRes = await fetch(apiUrl, {
              headers: {
                Authorization: 'Bearer ' + ghToken.trim(),
                Accept: 'application/vnd.github+json'
              }
            });
            if (getRes.ok) {
              const info = await getRes.json();
              sha = info.sha;
            }
            const jsonStr = JSON.stringify(payloadObj);
            const b64Content = btoa(unescape(encodeURIComponent(jsonStr)));
            const putBody = {
              message: 'Actualizacion catalogo en tiempo real',
              content: b64Content
            };
            if (sha) putBody.sha = sha;
            const ghRes = await fetch(apiUrl, {
              method: 'PUT',
              headers: {
                Authorization: 'Bearer ' + ghToken.trim(),
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(putBody)
            });
            if (ghRes.ok) {
              cloudSyncStatus = 'online';
            }
          } catch (e) {}
        }
      }

      function getCategoryIcon(catName) {
        const lower = String(catName || '').toLowerCase();
        if (lower === 'todos' || lower.includes('plataforma')) return '🌐';
        if (lower.includes('pack')) return '🔥';
        if (lower.includes('streaming')) return '🎬';
        if (lower.includes('video')) return '🎥';
        if (lower.includes('inteligencia') || lower.includes('ia')) return '🤖';
        if (lower.includes('curso')) return '🎓';
        if (lower.includes('pdf') || lower.includes('libro')) return '📚';
        if (lower.includes('lifehack') || lower.includes('hack')) return '⚡';
        if (lower.includes('aplicacion') || lower.includes('app')) return '📱';

      // ==========================================
      // MOTOR DE ESTRELLAS PONDERADO Y PROGRESIVO (EMPIEZA EN 0.5 ★ Y SUBE POCO A POCO SEGÚN VOTOS Y COMPRAS EN WHATSAPP)
      // ==========================================
      function calculateHotProductMetrics(p) {
        const organicClicks = Math.max(0, Number(p?.clics_organicos_wa) || 0);
        const votesMap = (p && typeof p.votos_detalle_usuarios === 'object' && p.votos_detalle_usuarios) ? p.votos_detalle_usuarios : {};
        const voteValues = Object.values(votesMap).map((v) => Number(v) || 0).filter((v) => v >= 1 && v <= 5);
        const legacyVotesCount = Math.max(0, Number(p?.votos_organicos_usuarios) || 0);
        const totalVotesCount = Math.max(voteValues.length, legacyVotesCount);

        // Si nunca ha tenido votos ni clics de compra en WhatsApp, permanece en Media Estrella (0.5 de 5.0)
        if (organicClicks <= 0 && totalVotesCount <= 0) {
          return {
            organicClicks: 0,
            organicRatings: 0,
            sumUserStars: 0,
            displayStars: 0.5,
            displaySales: 0,
            isHot: false
          };
        }

        // Suma real de estrellas dadas por los usuarios (o promedio 4.2 para votos anteriores si existieran)
        const sumUserStars = voteValues.length > 0
          ? voteValues.reduce((acc, n) => acc + n, 0)
          : totalVotesCount * 4.2;

        // Ponderación progresiva amortiguada (Ancla base de peso 4 con valor 0.5 ★):
        // Ejemplo real: Si está en 0.5 ★ y el 1er usuario le da 5 ★ -> (4*0.5 + 5) / (4 + 1) = 1.4 ★ (1 estrella y media, nunca salta a 5 de golpe)
        // Si un 2do usuario califica 5 ★ -> (2.0 + 10) / 6 = 2.0 ★
        // Si además alguien presiona Comprar por WhatsApp, cada clic aporta un peso suave de 0.65 con valor 4.6 ★
        const baseAnchorWeight = 4.0;
        const baseAnchorScore = 0.5;
        const waClickWeight = 0.65;
        const waClickTarget = 4.6;

        const weightedNumerator =
          baseAnchorWeight * baseAnchorScore +
          sumUserStars +
          organicClicks * waClickWeight * waClickTarget;

        const weightedDenominator =
          baseAnchorWeight +
          totalVotesCount +
          organicClicks * waClickWeight;

        const progressiveScore = Math.max(0.5, Math.min(5.0, weightedNumerator / weightedDenominator));
        const totalInteractions = organicClicks + totalVotesCount;

        return {
          organicClicks: organicClicks,
          organicRatings: totalVotesCount,
          sumUserStars: sumUserStars,
          displayStars: Number(progressiveScore.toFixed(1)),
          displaySales: totalInteractions,
          isHot: progressiveScore >= 3.8 && totalInteractions >= 4
        };
      }

      function normalizeProductsPlatforms(list) {

          const organicClicks = typeof p.clics_organicos_wa === 'number' ? p.clics_organicos_wa : 0;
          const organicVotes = typeof p.votos_organicos_usuarios === 'number' ? p.votos_organicos_usuarios : 0;
          const votesMap = (p.votos_detalle_usuarios && typeof p.votos_detalle_usuarios === 'object') ? p.votos_detalle_usuarios : {};
          const copy = Object.assign({}, p, {

            clics_organicos_wa: organicClicks,
            votos_organicos_usuarios: organicVotes,
            votos_detalle_usuarios: votesMap

          const metrics = calculateHotProductMetrics(copy);
          copy.estrellas_valor = metrics.displayStars;

      function compressImageFile(file, maxDim, cb) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            // Compresión WEBP optimizada (~150KB - 220KB para 1200x1200, nunca supera 1MB)
            let quality = maxDim >= 1000 ? 0.80 : 0.84;
            let dataUrl = canvas.toDataURL('image/webp', quality);
            if (dataUrl.length > 750000) {
              dataUrl = canvas.toDataURL('image/webp', 0.68);
            }
            cb(dataUrl);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      function getNextUniqueAlias() {
        if (!state.aliasPool || state.aliasPool.length === 0) {
          const copy = BUYER_ALIASES_DB.slice();
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
          }
          state.aliasPool = copy;
        }
        return state.aliasPool.pop();
      }

      function triggerLiveBanner() {
        if (state.activeTab !== 'catalogo' || state.selectedProductModal) return;
        const activeProds = state.products.filter(function (p) {
          return p && p.visible !== false && !isSoldOut(p);
        });
        if (activeProds.length === 0) return;

        const prod = activeProds[Math.floor(Math.random() * activeProds.length)];
        const isStock = Math.random() > 0.55;
        const buyer = getNextUniqueAlias();
        const added = Math.floor(Math.random() * 3) + 2;
        const title = isStock ? `🔥 Nuevo stock ingresado (+${added} cuentas)` : '⚡ Compra reciente verificada';
        const subtitle = isStock
          ? `${prod.titulo_producto} • S/ ${Number(prod.precio_pen).toFixed(2)}`
          : `@${buyer} adquirió ${prod.titulo_producto}`;

        const layer = document.getElementById('live-banner-layer');
        if (!layer) return;

        const boxClass = state.darkMode
          ? 'bg-[#151115]/95 border-emerald-500/50 text-zinc-100'
          : 'bg-white/95 border-emerald-500/60 text-slate-900 shadow-lg';

        // Notificación centrada al pie de página tanto en celular como en escritorio
        layer.innerHTML = `
          <div onclick="window.appActions.openModal('${esc(prod.id)}')" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 w-[92vw] max-w-xs p-2.5 rounded-xl border shadow-2xl cursor-pointer transition-all flex items-center gap-2.5 ${boxClass}">

            <div class="min-w-0 flex-1 leading-tight">

              <div class="font-calc text-[11px] font-bold truncate mt-0.5">${esc(subtitle)}</div>
              <div class="text-[9px] mt-0.5 opacity-70">Haz clic para ver producto →</div>
            </div>
            <button onclick="event.stopPropagation(); document.getElementById('live-banner-layer').innerHTML='';" class="p-1 text-zinc-400 hover:text-current self-start">✕</button>
          </div>
        `;

        setTimeout(function () {
          if (layer) layer.innerHTML = '';
        }, 6500);
      }

        saveFullClientProfile: function (e) {

          const newEmail = (document.getElementById('cli-prof-email')?.value || state.loggedClient.email || '').trim().toLowerCase();
          const newWhatsapp = (document.getElementById('cli-prof-whatsapp')?.value || state.loggedClient.whatsapp || '').trim();

          const taken = (state.registeredClients || []).some(

          );
          state.usernameCheckStatus = taken ? 'taken' : 'available';
          if (badge) {

        submitClientAuth: function (e) {
          e.preventDefault();
          if (!Array.isArray(state.registeredClients)) state.registeredClients = [];

          // MODO RECUPERAR CONTRASEÑA EN 2 PASOS (Paso 1: Solo pide Correo -> Paso 2: Si coincide, pide Nueva Contraseña)
          if (state.clientAuthMode === 'forgot') {
            if (!state.forgotEmailVerified) {
              const inputEmail = (document.getElementById('cli-forgot-email')?.value || '').trim().toLowerCase();
              if (!inputEmail) {
                state.clientAuthError = 'Ingresa tu correo electrónico registrado.';
                render();
                return;
              }
              const foundByEmail = state.registeredClients.find(
                (c) => String(c.email || '').toLowerCase() === inputEmail
              );
              if (!foundByEmail) {
                state.clientAuthError = 'No encontramos ninguna cuenta registrada con ese correo electrónico.';
                render();
                return;
              }
              state.forgotEmailVerified = inputEmail;
              state.clientAuthError = '';
              render();
              return;
            } else {
              const recNewPass = (document.getElementById('cli-forgot-pass')?.value || '').trim();
              if (!recNewPass || recNewPass.length < 4) {
                state.clientAuthError = 'Escribe una nueva contraseña de al menos 4 caracteres.';
                render();
                return;
              }
              const targetClient = state.registeredClients.find(
                (c) => String(c.email || '').toLowerCase() === state.forgotEmailVerified
              );
              if (!targetClient) {
                state.forgotEmailVerified = '';
                state.clientAuthError = 'Ocurrió un error, vuelve a ingresar tu correo.';
                render();
                return;
              }
              targetClient.pass = recNewPass;
              targetClient.updatedAt = Date.now();
              state.loggedClient = Object.assign({}, targetClient);
              state.forgotEmailVerified = '';
              state.isClientModalOpen = false;
              saveLocal();
              pushCatalogToGitHubLive();
              render();
              showToast(`¡Contraseña actualizada! Bienvenido @${targetClient.username}.`, 'success');
              return;
            }
          }

          // MODO 2: REGISTRO NUEVO CON VERIFICACIÓN DE USUARIO + WHATSAPP + CORREO
          if (state.clientAuthMode === 'register') {
            const username = (document.getElementById('cli-user-input')?.value || '').trim().replace(/\s+/g, '_');
            const email = (document.getElementById('cli-email-input')?.value || '').trim().toLowerCase();
            const whatsapp = (document.getElementById('cli-whatsapp-input')?.value || '').trim();
            const pass = document.getElementById('cli-pass-input')?.value || '';

            if (!username || username.length < 3 || !email || !whatsapp || !pass) {
              state.clientAuthError = 'Completa usuario, correo, WhatsApp y contraseña.';
              render();
              return;
            }
            const userExists = state.registeredClients.find(
              (c) => String(c.username || '').toLowerCase() === username.toLowerCase()
            );
            if (userExists) {
              state.clientAuthError = `El usuario @${username} ya se usó. Por favor elige otro alias.`;
              render();
              return;
            }
            const emailExists = state.registeredClients.find(
              (c) => String(c.email || '').toLowerCase() === email
            );
            if (emailExists) {
              state.clientAuthError = 'Ese correo ya está registrado. Haz clic en "Iniciar Sesión".';
              render();
              return;
            }

            const newClient = {
              id: 'cli-' + Date.now(),
              username: username,
              email: email,
              whatsapp: whatsapp,
              pass: pass,
              country: 'Perú',
              currencyName: 'Sol Peruano (S/ PEN)',
              timezoneLabel: 'Lima (GMT-5)',
              preferredLang: state.lang || 'es',
              schedStart: '09:00',
              schedEnd: '21:00',
              avatar: '',
              registeredAt: new Date().toLocaleString('es-PE'),
              updatedAt: Date.now()
            };
            state.registeredClients.unshift(newClient);
            state.loggedClient = Object.assign({}, newClient);
            state.isClientModalOpen = false;
            saveLocal();
            pushCatalogToGitHubLive();
            render();
            showToast(`¡Bienvenido @${newClient.username}! Tu cuenta está activa.`, 'success');

            if (state.pendingFreeProductId) {
              const pendingId = state.pendingFreeProductId;
              state.pendingFreeProductId = null;
              setTimeout(function () {
                window.appActions.confirmDirectOrder(pendingId);
              }, 250);
            }
          } else {
            // MODO 3: INICIAR SESIÓN
            const emailOrUser = (document.getElementById('cli-email-input')?.value || '').trim().toLowerCase();
            const pass = document.getElementById('cli-pass-input')?.value || '';
            const match = state.registeredClients.find(
              (c) =>
                (String(c.email || '').toLowerCase() === emailOrUser ||

        shareUrl: async function (productId) {
          const base = window.location.origin + window.location.pathname;
          const shareLink = productId ? `${base}?producto=${encodeURIComponent(productId)}` : base;
          const prod = productId ? state.products.find((x) => x.id === productId) : null;
          const isFree = prod && Number(prod.precio_pen) <= 0;
          const priceLabel = isFree ? '🎁 GRATIS' : `S/ ${Number(prod?.precio_pen || 0).toFixed(2)}`;
          const shareTitle = prod ? `${prod.titulo_producto} (${priceLabel}) • ${state.config.storeName}` : `${state.config.storeName} ${state.config.storeSubtitle}`;
          const shareText = prod
            ? `🔥 *${prod.titulo_producto}* (${priceLabel})\n⚡ Entrega inmediata por WhatsApp en ${state.config.storeName} ${state.config.storeSubtitle}\n👇 Míralo aquí:`
            : `🦙🎧 Explora el catálogo de *${state.config.storeName} ${state.config.storeSubtitle}* con entrega inmediata por WhatsApp:`;

          // Actualizar dinámicamente meta og:image para buscadores/redes
          if (prod && prod.imagen_url) {
            const ogImg = document.getElementById('dynamic-og-image');
            if (ogImg) ogImg.setAttribute('content', prod.imagen_url);
          }

          // En móviles compatibles con Web Share Level 2, convierte la miniatura del producto en archivo PNG para que WhatsApp/Redes muestren la foto junto con el link
          if (navigator.share) {
            try {
              if (prod && prod.imagen_url && navigator.canShare) {
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = 600;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.crossOrigin = 'anonymous';
                await new Promise(function (resolve) {
                  img.onload = resolve;
                  img.onerror = resolve;
                  img.src = prod.imagen_url;
                });
                ctx.fillStyle = '#09090b';
                ctx.fillRect(0, 0, 600, 600);
                ctx.drawImage(img, 0, 0, 600, 600);
                const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
                if (blob) {
                  const file = new File([blob], 'producto-alpaca.png', { type: 'image/png' });
                  if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                      title: shareTitle,
                      text: `${shareText} ${shareLink}`,
                      url: shareLink,
                      files: [file]
                    });
                    return;
                  }
                }
              }
              await navigator.share({ title: shareTitle, text: shareText, url: shareLink });
              return;
            } catch (e) {}
          }

          try {
            const ta = document.createElement('textarea');
            ta.value = `${shareText} ${shareLink}`;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          } catch (e) {}
          showToast('¡Enlace listo para pegar en WhatsApp o Redes!', 'success');
        },

        addToCart: function (id, qty) {
          const prod = state.products.find((p) => p.id === id);
          if (!prod || isSoldOut(prod)) return;
          const addQty = qty || 1;
          const existing = state.cart.find((c) => c.id === id);
          if (existing) {
            existing.quantity = Math.min(Number(prod.stock_disponible) || 1, existing.quantity + addQty);
          } else {
            state.cart.push(Object.assign({}, prod, { quantity: Math.min(Number(prod.stock_disponible) || 1, addQty) }));
          }
          saveLocal();
          showToast(`Agregado al combo: ${prod.titulo_producto}`, 'success');
          render();
        },
        updateCartQty: function (id, delta) {
          state.cart = state.cart
            .map(function (item) {
              if (item.id !== id) return item;
              const next = item.quantity + delta;
              if (next <= 0) return null;
              return Object.assign({}, item, { quantity: Math.min(Number(item.stock_disponible) || 99, next) });
            })
            .filter(Boolean);
          saveLocal();
          render();

        confirmDirectOrder: function (id) {
          const prod = state.products.find((p) => p.id === id);
          if (!prod || isSoldOut(prod)) return;
          const isFree = Number(prod.precio_pen) <= 0;

          // Si el producto es GRATUITO (S/ 0.00), obliga a iniciar sesión / registrarse con Correo y WhatsApp antes de enviarlo a WhatsApp
          if (isFree && (!state.loggedClient || !state.loggedClient.whatsapp || !state.loggedClient.email)) {
            state.pendingFreeProductId = prod.id;
            state.isClientModalOpen = true;
            state.clientAuthMode = state.loggedClient ? 'profile' : 'register';
            state.clientAuthError = '🎁 El premio o compra gratuita será enviada por correo o WhatsApp. Regístrate o completa tu Correo y WhatsApp para reclamarlo.';
            render();
            return;
          }

          const qty = isFree ? 1 : state.modalQuantity;
          const totalPenNum = Number(prod.precio_pen) * qty;
          const totalPenLabel = isFree ? 'GRATIS (S/ 0.00)' : `S/ ${totalPenNum.toFixed(2)}`;
          const storeTitle = `${state.config.storeName} ${state.config.storeSubtitle}`.trim();

          prod.stock_disponible = Math.max(0, (Number(prod.stock_disponible) || 0) - qty);
          // Incrementar clic orgánico real en WhatsApp y dejar que el sistema infle las estrellas automáticamente
          prod.clics_organicos_wa = (Number(prod.clics_organicos_wa) || 0) + qty;
          const updatedMetrics = calculateHotProductMetrics(prod);
          prod.estrellas_valor = updatedMetrics.displayStars;
          prod.ventas_totales = updatedMetrics.displaySales;
          prod.ultima_actividad_usuario = state.loggedClient ? state.loggedClient.username : getNextUniqueAlias();
          prod.ultima_actividad_texto = state.lang === 'es' ? 'hace unos segundos' : 'just now';

          state.ordersHistory.unshift({
            id: 'ord-' + Date.now(),
            timestamp: new Date().toLocaleString('es-PE'),
            type: isFree ? 'Regalo Gratis' : 'Compra Directa',
            customer: state.loggedClient
              ? `@${state.loggedClient.username} (${state.loggedClient.whatsapp || state.loggedClient.email})`
              : `${qty} cuenta(s) • ${state.selectedPaymentMethod}`,
            paymentMethod: isFree ? 'GRATIS (Club VIP)' : state.selectedPaymentMethod,
            totalPen: totalPenNum.toFixed(2),
            items: [{ id: prod.id, title: prod.titulo_producto, qty: qty }],
            restored: false,
            status: 'Enviado a WhatsApp'
          });

          saveLocal();
          pushCatalogToGitHubLive();

          let msg = '';
          if (isFree && state.loggedClient) {
            msg = `¡Hola *${storeTitle}*! 🦙🎁\nEstoy registrado en la web y deseo reclamar el producto *GRATIS*:\n\n🎁 *Producto:* ${prod.titulo_producto}\n👤 *Usuario:* @${state.loggedClient.username}\n📧 *Correo:* ${state.loggedClient.email}\n📱 *Mi WhatsApp:* ${state.loggedClient.whatsapp}\n⏳ *Duración:* ${prod.duracion} (${prod.tipo_entrega})\n\nQuedo atento para recibir mi premio/acceso gratuito por correo o WhatsApp.`;
          } else {
            msg = (state.config.whatsappTemplateSingle || INITIAL_CONFIG.whatsappTemplateSingle)
              .replace('{tienda}', storeTitle)
              .replace('{producto}', prod.titulo_producto)
              .replace('{cantidad}', String(qty))
              .replace(/\{metodo_pago\}/g, state.selectedPaymentMethod)
              .replace('{duracion}', prod.duracion)
              .replace('{entrega}', prod.tipo_entrega)
              .replace('{total_pen}', totalPenLabel);
          }

          const phone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          render();
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');
        },
        askRestock: function (id) {
          const prod = state.products.find((p) => p.id === id);
          if (!prod) return;
          const storeTitle = `${state.config.storeName} ${state.config.storeSubtitle}`.trim();
          const msg = (state.config.whatsappTemplateRestock || INITIAL_CONFIG.whatsappTemplateRestock)
            .replace('{tienda}', storeTitle)

            .replace('{duracion}', prod.duracion);

        sendComboOrder: function () {
          if (state.cart.length === 0) return;
          const storeTitle = `${state.config.storeName} ${state.config.storeSubtitle}`.trim();
          let totalPen = 0;
          let totalItems = 0;
          const lines = state.cart.map(function (item, idx) {
            const sub = Number(item.precio_pen) * item.quantity;
            totalPen += sub;
            totalItems += item.quantity;
            const realProd = state.products.find((p) => p.id === item.id);
            if (realProd) {
              realProd.stock_disponible = Math.max(0, (Number(realProd.stock_disponible) || 0) - item.quantity);
              realProd.clics_organicos_wa = (Number(realProd.clics_organicos_wa) || 0) + item.quantity;
              const m = calculateHotProductMetrics(realProd);
              realProd.estrellas_valor = m.displayStars;
              realProd.ventas_totales = m.displaySales;
            }
            return `${idx + 1}. 📦 *${item.titulo_producto}*\n   🔢 Cantidad: *${item.quantity} cuenta(s)* - S/ ${sub.toFixed(2)}`;
          });

          const msg = (state.config.whatsappTemplateCombo || INITIAL_CONFIG.whatsappTemplateCombo)
            .replace('{tienda}', storeTitle)
            .replace('{lista_productos}', lines.join('\n\n'))
            .replace('{total_cuentas}', String(totalItems))
            .replace(/\{metodo_pago\}/g, state.selectedPaymentMethod)
            .replace('{total_pen}', totalPen.toFixed(2));

          state.ordersHistory.unshift({
            id: 'ord-' + Date.now(),
            timestamp: new Date().toLocaleString('es-PE'),
            type: 'Combo Carrito',
            customer: `Combo (${totalItems} cuentas)`,
            paymentMethod: state.selectedPaymentMethod,
            totalPen: totalPen.toFixed(2),
            items: state.cart.map((c) => ({ id: c.id, title: c.titulo_producto, qty: c.quantity })),
            restored: false,
            status: 'Enviado a WhatsApp'
          });

          state.cart = [];
          state.isCartOpen = false;
          saveLocal();
          pushCatalogToGitHubLive();
          render();

          const phone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');
        },

        exportContentBackup: function () {
          // Guardamos en el Backup SOLO la parte orgánica de las estrellas (clics_organicos_wa y votos_organicos_usuarios)
          // junto con los productos, clientes (usuarios/contraseñas), iconos, categorías y configuración.
          const cleanOrganicProducts = state.products.map(function (p) {
            const copy = Object.assign({}, p);
            copy.clics_organicos_wa = Math.max(0, Number(p.clics_organicos_wa) || 0);
            copy.votos_organicos_usuarios = Math.max(0, Number(p.votos_organicos_usuarios) || 0);
            delete copy.estrellas_valor;
            delete copy.ventas_totales;
            return copy;
          });

          const payload = {
            version: 'alpaca-content-backup-v3-organic-stars',
            exportedAt: new Date().toISOString(),
            config: state.config,
            platforms: state.platforms,
            products: cleanOrganicProducts.map(function (cp) {
              cp.votos_detalle_usuarios = (cp.votos_detalle_usuarios && typeof cp.votos_detalle_usuarios === 'object') ? cp.votos_detalle_usuarios : {};
              return cp;
            }),
            ordersHistory: state.ordersHistory,
            registeredClients: state.registeredClients || []
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `alpaca-contenido-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showToast('Backup (.json) guardado con clientes, productos y estrellas orgánicas puras.', 'success');
        },
        importContentBackup: function (input) {
          const file = input.files && input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function (ev) {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (parsed.config) state.config = Object.assign({}, INITIAL_CONFIG, state.config, parsed.config);
              if (Array.isArray(parsed.platforms)) state.platforms = parsed.platforms;
              if (Array.isArray(parsed.products)) {
                const incoming = normalizeProductsPlatforms(parsed.products);
                const currentProducts = state.products.slice();
                let addedCount = 0;
                let copiedCount = 0;

                incoming.forEach(function (incProd) {
                  if (!incProd || !incProd.titulo_producto) return;
                  const cleanTitle = String(incProd.titulo_producto).trim();
                  const duplicateByTitle = currentProducts.find(function (existing) {
                    return String(existing.titulo_producto || '').trim().toLowerCase() === cleanTitle.toLowerCase();
                  });

                  if (duplicateByTitle) {
                    // Si el nombre ya existe, crea un duplicado con "(Copia)" para que no pierdas el control ni se sobreescriba
                    const copyTitle = cleanTitle.includes('(Copia)') ? cleanTitle + ' 2' : cleanTitle + ' (Copia)';
                    currentProducts.unshift(
                      Object.assign({}, incProd, {
                        id: 'prod-copy-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                        titulo_producto: copyTitle
                      })
                    );
                    copiedCount++;
                  } else {
                    // Si es un nombre nuevo que no existe, entra directo como único
                    currentProducts.unshift(
                      Object.assign({}, incProd, {
                        id: incProd.id || 'prod-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
                      })
                    );
                    addedCount++;
                  }
                });

                state.products = currentProducts;
                showToast(`Backup cargado: ${addedCount} nuevos y ${copiedCount} marcados como (Copia) para tu revisión.`, 'success');
              }
              if (Array.isArray(parsed.ordersHistory)) state.ordersHistory = parsed.ordersHistory;
              if (Array.isArray(parsed.registeredClients)) {
                const existingEmails = new Set((state.registeredClients || []).map((c) => String(c.email || '').toLowerCase()));
                const mergedClients = (state.registeredClients || []).slice();
                parsed.registeredClients.forEach(function (cli) {
                  if (cli && cli.email && !existingEmails.has(String(cli.email).toLowerCase())) {
                    mergedClients.push(cli);
                  }
                });
                state.registeredClients = mergedClients;
              }
              saveLocal();
              pushCatalogToGitHubLive();
              render();
            } catch (err) {
              showToast('Error al leer el archivo .json', 'error');
            }
          };
          reader.readAsText(file);
        },
        downloadFullIndexHtml: function () {
          const clone = document.documentElement.cloneNode(true);
          // Limpiar cualquier script o atributo inyectado por previsualizadores externos antes de descargar
          clone.querySelectorAll('[data-bard-client-injected], [ws-interception-config]').forEach(function (el) {
            el.remove();
          });
          const appDiv = clone.querySelector('#app');
          if (appDiv) appDiv.innerHTML = '';
          const bannerDiv = clone.querySelector('#live-banner-layer');
          if (bannerDiv) bannerDiv.innerHTML = '';
          const toastDiv = clone.querySelector('#toast-layer');
          if (toastDiv) toastDiv.innerHTML = '';

          let embScript = clone.querySelector('#alpaca-embedded-data');
          if (!embScript) {
            embScript = document.createElement('script');
            embScript.id = 'alpaca-embedded-data';
            clone.querySelector('body').insertBefore(embScript, clone.querySelector('body script'));
          }
          const safeJson = JSON.stringify({
            buildStamp: 'build-' + Date.now(),
            config: state.config,
            platforms: state.platforms,
            products: state.products,
            ordersHistory: state.ordersHistory,
            registeredClients: state.registeredClients || []
          }).replace(/<\//g, '<\\/');
          embScript.textContent = 'window.__ALPACA_EMBEDDED_STATE__ = ' + safeJson + ';';

          const finalHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
          const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showToast('¡Archivo index.html Todo-en-Uno descargado para GitHub Pages!', 'success');
        }

                      <div>
                        <label class="block font-calc font-bold mb-1">Correo Electrónico Registrado</label>
                        <input id="cli-forgot-email" type="email" required placeholder="tucorreo@gmail.com" class="w-full px-3 py-2 rounded-lg border ${state.darkMode ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}" />
                      </div>
                    ` : `
                      <div class="p-2.5 rounded-lg bg-emerald-500/15 border border-emerald-500/40 text-[11px] text-emerald-300 font-bold">
                        ✓ Correo verificado: ${esc(state.forgotEmailVerified)}
                      </div>
                      <div>
                        <label class="block font-calc font-bold mb-1">Escribe tu Nueva Contraseña</label>
                        <div class="relative">
                          <input id="cli-forgot-pass" type="password" required placeholder="Nueva contraseña" class="w-full pl-3 pr-10 py-2 rounded-lg border ${state.darkMode ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}" />
                          <button type="button" onclick="window.appActions.togglePassEye('cli-forgot-pass', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm opacity-80 hover:opacity-100" title="Mostrar / Ocultar contraseña">👁️</button>
                        </div>
                      </div>
                    `}

                    ${state.clientAuthError ? `<div class="p-2.5 rounded-lg bg-amber-500/15 border border-amber-500/40 text-[11px] text-amber-300 font-bold">${esc(state.clientAuthError)}</div>` : ''}

                    <button type="submit" style="${primaryGrad}" class="w-full py-2 rounded-xl text-white font-calc font-extrabold text-xs shadow-lg">
                      ${!state.forgotEmailVerified ? 'Verificar Correo →' : 'Guardar Nueva Contraseña'}
                    </button>

                    <div class="flex items-center justify-between pt-2 border-t ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'} text-[11px] font-calc">
                      <button type="button" onclick="window.appActions.switchClientAuthMode('login')" class="text-zinc-400 hover:text-white font-bold">← Volver a Iniciar Sesión</button>
                      <button type="button" onclick="window.appActions.switchClientAuthMode('register')" class="text-emerald-400 hover:underline font-bold">Crear cuenta nueva</button>
                    </div>
                  </form>
                ` : `
                  <!-- FORMULARIO LIMPIO DE ACCEDER (INICIAR SESIÓN) CON OJO PARA VER CONTRASEÑA -->
                  <form onsubmit="window.appActions.submitClientAuth(event)" class="space-y-3 text-xs">
                    ${state.clientAuthMode === 'register' ? `
                      <div>
                        <div class="flex items-center justify-between mb-1">
                          <label class="font-calc font-bold">Nombre de Usuario (Único)</label>
                          <div id="cli-username-status-badge" class="font-calc text-[10px]"></div>
                        </div>
                        <input id="cli-user-input" type="text" required oninput="window.appActions.checkUsernameAvailability(this.value)" placeholder="Ej: carlos_vip" class="w-full px-3 py-2 rounded-lg border font-num ${state.darkMode ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}" />
                      </div>
                      <div>
                        <label class="block font-calc font-bold mb-1">Correo Electrónico</label>
                        <input id="cli-email-input" type="email" required placeholder="tucorreo@gmail.com" class="w-full px-3 py-2 rounded-lg border ${state.darkMode ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}" />
                      </div>
                      <div>
                        <label class="block font-calc font-bold text-emerald-400 mb-1">📱 Número de WhatsApp (Obligatorio para premios/gratis)</label>
                        <input id="cli-whatsapp-input" type="text" required placeholder="+51 987 654 321" class="w-full px-3 py-2 rounded-lg border font-num font-bold ${state.darkMode ? 'bg-zinc-900 border-emerald-500/40 text-emerald-300' : 'bg-slate-50 border-emerald-300 text-slate-900'}" />
                      </div>
                    ` : `
                      <div>
                        <label class="block font-calc font-bold mb-1">Usuario o Correo Electrónico</label>
                        <input id="cli-email-input" type="text" required placeholder="Tu @usuario o correo" class="w-full px-3 py-2 rounded-lg border ${state.darkMode ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}" />
                      </div>
                    `}
                    <div>
                      <label class="block font-calc font-bold mb-1">Contraseña</label>
                      <div class="relative">
                        <input id="cli-pass-input" type="password" required placeholder="••••••••" class="w-full pl-3 pr-10 py-2 rounded-lg border ${state.darkMode ? 'bg-zinc-900 border-zinc-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-900'}" />
                        <button type="button" onclick="window.appActions.togglePassEye('cli-pass-input', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm opacity-80 hover:opacity-100" title="Mostrar / Ocultar contraseña">👁️</button>
                      </div>
                    </div>

                    ${state.clientAuthError ? `<div class="p-2.5 rounded-lg bg-amber-500/15 border border-amber-500/40 text-[11px] text-amber-300 font-bold">${esc(state.clientAuthError)}</div>` : ''}

                    <button type="submit" style="${primaryGrad}" class="w-full py-2.5 rounded-xl text-white font-calc font-extrabold text-xs shadow-lg">
                      ${state.clientAuthMode === 'register' ? '🎁 Crear Cuenta Ahora' : '🔑 Iniciar Sesión'}
                    </button>

                    <!-- ENLACES DEBAJO DEL BOTÓN: OLVIDÉ CONTRASEÑA Y REGISTRO -->
                    <div class="pt-2.5 border-t ${state.darkMode ? 'border-zinc-800/80' : 'border-slate-200'} flex items-center justify-between text-[11px] font-calc">
                      ${state.clientAuthMode === 'login' ? `
                        <button type="button" onclick="window.appActions.switchClientAuthMode('forgot')" class="text-zinc-400 hover:text-amber-400 font-semibold transition">
                          ¿Olvidaste tu contraseña?
                        </button>
                        <button type="button" onclick="window.appActions.switchClientAuthMode('register')" class="text-emerald-400 hover:underline font-extrabold">
                          Crear cuenta / Registro →
                        </button>
                      ` : `
                        <span class="${textMuted}">¿Ya tienes una cuenta?</span>
                        <button type="button" onclick="window.appActions.switchClientAuthMode('login')" class="text-emerald-400 hover:underline font-extrabold">
                          ← Volver a Iniciar Sesión
                        </button>
                      `}
                    </div>
                  </form>
                `}
              </div>
            </div>
          ` : ''}

          <!-- MODAL DE ACCESO PRIVADO ADMIN (CON OJO REVELADOR DE CONTRASEÑA) -->
          ${state.isLoginModalOpen ? `
            <div onclick="window.appActions.closeLogin()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div onclick="event.stopPropagation()" class="w-full max-w-sm rounded-2xl bg-[#151114] border border-zinc-800 p-5 space-y-4 text-zinc-100 shadow-2xl">
                <div class="flex items-center justify-between">
                  <h3 class="font-calc text-sm font-extrabold text-emerald-400">🔒 Acceso Interno Autorizado</h3>
                  <button onclick="window.appActions.closeLogin()" class="text-zinc-400 hover:text-white">✕</button>
                </div>
                <form onsubmit="window.appActions.submitLogin(event)" class="space-y-3 text-xs">
                  <div>
                    <label class="block font-calc font-bold text-zinc-300 mb-1">Correo Electrónico</label>
                    <input id="login-email-input" type="email" required placeholder="Tu correo autorizado" class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-white" />
                  </div>
                  <div>
                    <label class="block font-calc font-bold text-zinc-300 mb-1">Contraseña</label>
                    <div class="relative">
                      <input id="login-pass-input" type="password" required placeholder="••••••••" class="w-full pl-3 pr-10 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-white" />
                      <button type="button" onclick="window.appActions.togglePassEye('login-pass-input', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm opacity-80 hover:opacity-100" title="Mostrar / Ocultar contraseña">👁️</button>
                    </div>
                  </div>
                  ${state.loginError ? `<div class="text-[11px] text-red-400 font-bold">${esc(state.loginError)}</div>` : ''}
                  <button type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 text-black font-calc font-extrabold text-xs">Ingresar al Panel</button>
                </form>
              </div>
            </div>
          ` : ''}

          <!-- DRAWER DEL CARRITO -->
          ${state.isCartOpen ? `
            <div onclick="window.appActions.toggleCart(false)" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex justify-end">
              <div onclick="event.stopPropagation()" class="w-full max-w-md border-l h-full flex flex-col justify-between shadow-2xl ${state.darkMode ? 'bg-[#141013] border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'}">
                <div class="p-4 border-b flex items-center justify-between ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'}">
                  <h3 class="font-calc text-sm font-extrabold">🛒 ${t.comboTitle}</h3>
                  <button onclick="window.appActions.toggleCart(false)">✕</button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-3">
                  ${state.cart.length === 0 ? `<div class="text-center py-12 text-xs text-zinc-500 font-calc">${t.emptyCombo}</div>` : `
                    ${state.cart.map((item) => `
                      <div class="p-2.5 rounded-xl border flex items-center justify-between gap-2 ${state.darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-slate-50 border-slate-200'}">
                        <div class="flex items-center gap-2 min-w-0">
                          <img src="${item.imagen_url}" class="w-10 h-10 rounded object-cover" />
                          <div class="min-w-0">
                            <div class="font-calc text-xs font-bold truncate">${esc(item.titulo_producto)}</div>
                            <div class="font-num text-[11px] text-emerald-500 font-bold">S/ ${Number(item.precio_pen).toFixed(2)} c/u</div>
                          </div>
                        </div>
                        <div class="flex items-center gap-1 font-num text-xs">
                          <button onclick="window.appActions.updateCartQty('${esc(item.id)}', -1)" class="w-6 h-6 rounded bg-zinc-800 text-white">-</button>
                          <span class="w-5 text-center font-bold">${item.quantity}</span>
                          <button onclick="window.appActions.updateCartQty('${esc(item.id)}', 1)" class="w-6 h-6 rounded bg-zinc-800 text-white">+</button>
                        </div>
                      </div>
                    `).join('')}
                    <div>
                      <label class="block font-calc text-xs font-bold text-emerald-500 mb-1.5">💳 ${t.paymentMethodLabel}</label>
                      <div class="grid grid-cols-3 gap-1.5">
                        ${(state.config.paymentMethods || INITIAL_CONFIG.paymentMethods).map((m) => `
                          <button type="button" onclick="window.appActions.selectPayment('${esc(m)}')" class="py-1.5 px-2 rounded-lg font-calc text-[11px] font-bold border truncate ${state.selectedPaymentMethod === m ? 'bg-emerald-500 text-black border-emerald-400 font-extrabold' : 'bg-zinc-900 text-zinc-300 border-zinc-800'}">${esc(m)}</button>
                        `).join('')}
                      </div>
                    </div>
                  `}
                </div>
                ${state.cart.length > 0 ? `
                  <div class="p-4 border-t space-y-2.5 ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'}">
                    <div class="flex items-center justify-between font-calc">
                      <span class="text-xs ${textMuted}">Total a Pagar:</span>
                      <span class="font-num text-base font-extrabold">S/ ${cartTotalPen.toFixed(2)}</span>
                    </div>
                    <button onclick="window.appActions.sendComboOrder()" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-calc font-extrabold text-xs">💬 ${t.sendWhatsAppOrder}</button>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          <!-- BOTÓN FLOTANTE DE SOPORTE / CARRITO SINCRONIZADO CON TUS COLORES ELEGIDOS -->
          <button onclick="window.appActions.toggleCart(true)" style="${primaryGrad}" class="fixed bottom-3.5 right-3.5 z-40 px-3.5 py-2 rounded-lg text-white font-calc font-bold text-xs shadow-xl flex items-center gap-1.5">
            <span>🎧</span>
            <span>${cartTotalItems > 0 ? `Carrito (${cartTotalItems}) • S/ ${cartTotalPen.toFixed(2)}` : 'Soporte'}</span>
          </button>
        `;

        // Restaurar instantáneamente la posición del scroll del Popup y de la ventana para que NUNCA te patee hacia arriba
        const nextModalBody = document.getElementById('alpaca-modal-scroll-body');
        if (nextModalBody && savedModalScrollTop > 0) {
          nextModalBody.scrollTop = savedModalScrollTop;
        }
        if (!state.selectedProductModal && prevWindowScrollY > 0) {
          window.scrollTo(0, prevWindowScrollY);
        }
      }

      // Atajo de teclado Alt + A para abrir Panel Privado
      window.addEventListener('keydown', function (e) {
        if (e.altKey && e.key.toLowerCase() === 'a') {
          e.preventDefault();
          window.appActions.openLogin();
        } else if (e.key === 'Escape') {
          if (state.selectedProductModal || state.isLoginModalOpen || state.isCartOpen || state.isClientModalOpen) {
            state.selectedProductModal = null;
            state.isLoginModalOpen = false;
            state.isCartOpen = false;
            state.isClientModalOpen = false;
            render();
          }
        }
      });

      window.onload = function () {
        render();
        fetchLiveCloudCatalog();
        try {
          const params = new URLSearchParams(window.location.search);
          const sharedId = params.get('producto');
          if (sharedId) {
            const target = state.products.find((p) => p.id === sharedId);
            if (target) {
              state.selectedProductModal = target;
              render();
            }
          }
        } catch (e) {}
      };
    })();
  </script>

</body></html>
