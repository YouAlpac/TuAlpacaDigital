          <rect width="80" height="80" rx="14" fill="${bg}" ${strokeAttr} />

      // ==========================================
      // 4. ESTADO Y PERSISTENCIA
      // ==========================================
      function loadJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
          return fallback;
        }
      }

      // Auto-detector de plataforma por título para evitar "0 productos disponibles"
      function autoDetectPlatformId(title, currentPlat) {
        if (currentPlat && currentPlat !== 'all') return currentPlat;
        const lower = String(title || '').toLowerCase();
        const rules = [
          { kw: 'netflix', id: 'netflix' },
          { kw: 'prime', id: 'prime' },
          { kw: 'disney', id: 'disney' },
          { kw: 'youtube', id: 'youtube' },
          { kw: 'spotify', id: 'spotify' },
          { kw: 'crunchy', id: 'crunchyroll' },
          { kw: 'max', id: 'max' },
          { kw: 'hbo', id: 'max' },
          { kw: 'paramount', id: 'paramount' },
          { kw: 'vix', id: 'vix' },
          { kw: 'capcut', id: 'capcut' },
          { kw: 'canva', id: 'canva' },
          { kw: 'iptv', id: 'iptv' },
          { kw: 'chatgpt', id: 'chatgpt' },
          { kw: 'gemini', id: 'gemini' },
          { kw: 'grok', id: 'grok' },
          { kw: 'turnitin', id: 'turnitin' },
          { kw: 'curso', id: 'udemy' },
          { kw: 'pdf', id: 'pdfpack' },
          { kw: 'lifehack', id: 'lifehack' },
          { kw: 'office', id: 'office365' },
          { kw: '365', id: 'office365' }
        ];
        for (let i = 0; i < rules.length; i++) {
          if (lower.includes(rules[i].kw)) return rules[i].id;
        }
        return currentPlat || 'prime';
      }

      function normalizeProductsPlatforms(list) {
        if (!Array.isArray(list)) return [];
        return list.map(function (p) {
          if (!p) return p;
          const fixedPlat = autoDetectPlatformId(p.titulo_producto, p.plataforma_id);
          return fixedPlat !== p.plataforma_id ? Object.assign({}, p, { plataforma_id: fixedPlat }) : p;
        });
      }

      const embeddedData = window.__ALPACA_EMBEDDED_STATE__ || null;
      if (embeddedData && embeddedData.buildStamp) {
        const prevStamp = localStorage.getItem('alpaca_last_build_stamp');
        if (prevStamp !== embeddedData.buildStamp) {
          try {
            if (embeddedData.config) localStorage.setItem('alpaca_zeyn_config_v2', JSON.stringify(embeddedData.config));
            if (embeddedData.platforms) localStorage.setItem('alpaca_zeyn_platforms_v2', JSON.stringify(embeddedData.platforms));
            if (embeddedData.products) localStorage.setItem('alpaca_zeyn_products_v2', JSON.stringify(normalizeProductsPlatforms(embeddedData.products)));
            localStorage.setItem('alpaca_last_build_stamp', embeddedData.buildStamp);
          } catch (e) {}
        }
      }

      function saveLocal() {
        try {
          localStorage.setItem('alpaca_zeyn_config_v2', JSON.stringify(state.config));
          localStorage.setItem('alpaca_zeyn_platforms_v2', JSON.stringify(state.platforms));
          localStorage.setItem('alpaca_zeyn_products_v2', JSON.stringify(state.products));
          localStorage.setItem('alpaca_zeyn_cart_v2', JSON.stringify(state.cart));

      // ==========================================
      // 5. MOTOR DE SINCRONIZACIÓN EN TIEMPO REAL (JSONBLOB BODY POST/PUT SIN LÍMITE DE URL - COMPATIBLE CON MOZILLA, BRAVE, CHROME Y CELULARES)
      // ==========================================
      const CLOUD_BLOB_ID_KEY = 'alpaca_jsonblob_id_v1';
      const FIXED_PUBLIC_BLOB_ID = '1368945201948278784';
      let activeBlobId = localStorage.getItem(CLOUD_BLOB_ID_KEY) || FIXED_PUBLIC_BLOB_ID;

      let liveSyncChannel = null;
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          liveSyncChannel = new BroadcastChannel('alpaca_realtime_channel');
          liveSyncChannel.onmessage = function (ev) {
            if (ev.data && ev.data.type === 'ALPACA_LIVE_UPDATE') {
              applyIncomingRealtimeData(ev.data.payload);
            }
          };
        }
      } catch (e) {}

      window.addEventListener('storage', function (ev) {
        if (ev.key === 'alpaca_zeyn_products_v2' && ev.newValue) {
          try {
            state.products = normalizeProductsPlatforms(JSON.parse(ev.newValue));
            render();
          } catch (e) {}
        }
      });

      let lastSyncedTimestamp = Number(localStorage.getItem('alpaca_last_live_ts') || 0);
      let cloudSyncStatus = 'online';

      function applyIncomingRealtimeData(data) {
        if (!data || !Array.isArray(data.products) || data.products.length === 0) return;
        const incomingTs = Number(data.updatedAt || 0);
        if (incomingTs && incomingTs <= lastSyncedTimestamp) return;
        lastSyncedTimestamp = incomingTs || Date.now();
        localStorage.setItem('alpaca_last_live_ts', String(lastSyncedTimestamp));

        state.products = normalizeProductsPlatforms(data.products);
        if (Array.isArray(data.platforms) && data.platforms.length > 0) state.platforms = data.platforms;
        if (data.config) state.config = Object.assign({}, state.config, data.config, { partners: state.config.partners });
        saveLocal();
        if (state.activeTab !== 'admin') {
          render();
        }
      }

      async function fetchLiveCloudCatalog() {
        try {
          const localRepoRes = await fetch('./catalog.json?t=' + Date.now(), { cache: 'no-store' });
          if (localRepoRes.ok) {
            const repoData = await localRepoRes.json();
            if (repoData && Array.isArray(repoData.products)) {
              applyIncomingRealtimeData(repoData);
            }
          }
        } catch (e) {}

        try {
          const res = await fetch('https://jsonblob.com/api/jsonBlob/' + activeBlobId, {
            method: 'GET',
            headers: { Accept: 'application/json' },
            cache: 'no-store'
          });
          if (res.ok) {
            const parsed = await res.json();
            if (parsed && Array.isArray(parsed.products)) {
              cloudSyncStatus = 'online';
              applyIncomingRealtimeData(parsed);
            }
          }
        } catch (e) {}
      }

      async function pushCatalogToGitHubLive() {
        state.products = normalizeProductsPlatforms(state.products);
        const nowTs = Date.now();
        lastSyncedTimestamp = nowTs;
        localStorage.setItem('alpaca_last_live_ts', String(nowTs));

        const payloadObj = {
          updatedAt: nowTs,
          config: state.config,
          platforms: state.platforms,
          products: state.products
        };

        try {
          if (liveSyncChannel) {
            liveSyncChannel.postMessage({ type: 'ALPACA_LIVE_UPDATE', payload: payloadObj });
          }
        } catch (e) {}

        try {
          const putRes = await fetch('https://jsonblob.com/api/jsonBlob/' + activeBlobId, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json'
            },
            body: JSON.stringify(payloadObj)
          });
          if (putRes.ok) {
            cloudSyncStatus = 'online';
          } else {
            const postRes = await fetch('https://jsonblob.com/api/jsonBlob', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Accept: 'application/json'
              },
              body: JSON.stringify(payloadObj)
            });
            if (postRes.ok) {
              const loc = postRes.headers.get('Location') || postRes.headers.get('X-jsonblob');
              if (loc) {
                const newId = loc.split('/').pop();
                if (newId) {
                  activeBlobId = newId;
                  localStorage.setItem(CLOUD_BLOB_ID_KEY, newId);
                }
              }
              cloudSyncStatus = 'online';
            }
          }
        } catch (e) {
          cloudSyncStatus = 'local';
        }
      }

      setInterval(function () {
        if (state.activeTab === 'catalogo' && !state.selectedProductModal) {
          fetchLiveCloudCatalog();
        }
      }, 5000);

      // ==========================================
      // 6. HELPERS DE UI Y NOTIFICACIONES

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function isSoldOut(p) {
        return !p || p.modo_agotado === 'manual_agotado' || Number(p.stock_disponible) <= 0;

      function showToast(msg, type) {
        const layer = document.getElementById('toast-layer');

        layer.innerHTML = `
          <div class="fixed bottom-16 right-4 z-50 max-w-xs px-3.5 py-2.5 rounded-xl border shadow-2xl flex items-center gap-2 text-xs font-calc font-bold ${bg}">
            <span>✓</span>
            <span>${esc(msg)}</span>
          </div>
        `;
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(function () {
          if (layer) layer.innerHTML = '';
        }, 3200);
      }

      function compressImageFile(file, maxDim, cb) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            cb(canvas.toDataURL('image/webp', 0.78));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      function getNextUniqueAlias() {
        if (!state.aliasPool || state.aliasPool.length === 0) {
          const copy = BUYER_ALIASES_DB.slice();
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
          }
          state.aliasPool = copy;
        }
        return state.aliasPool.pop();
      }

      function triggerLiveBanner() {
        if (state.activeTab !== 'catalogo' || state.selectedProductModal) return;
        const activeProds = state.products.filter(function (p) {
          return p && p.visible !== false && !isSoldOut(p);
        });
        if (activeProds.length === 0) return;

        const buyer = getNextUniqueAlias();
        const added = Math.floor(Math.random() * 3) + 2;
        const title = isStock ? `🔥 Nuevo stock ingresado (+${added} cuentas)` : '⚡ Compra reciente verificada';
        const subtitle = isStock
          ? `${prod.titulo_producto} • S/ ${Number(prod.precio_pen).toFixed(2)}`
          : `@${buyer} adquirió ${prod.titulo_producto}`;

        const layer = document.getElementById('live-banner-layer');

        const boxClass = state.darkMode

          </div>
        `;

        setTimeout(function () {
          if (layer) layer.innerHTML = '';

      setTimeout(triggerLiveBanner, 12000);

        shareUrl: function (productId) {
          const base = window.location.origin + window.location.pathname;
          const shareLink = productId ? `${base}?producto=${encodeURIComponent(productId)}` : base;
          const prod = productId ? state.products.find((x) => x.id === productId) : null;
          const shareTitle = prod ? `${prod.titulo_producto} • ${state.config.storeName}` : `${state.config.storeName} ${state.config.storeSubtitle}`;
          const shareText = prod
            ? `Mira este producto en ${state.config.storeName}: ${prod.titulo_producto} a S/ ${Number(prod.precio_pen).toFixed(2)}`
            : `Explora nuestro catálogo digital con entrega inmediata por WhatsApp`;

          if (navigator.share) {
            navigator.share({ title: shareTitle, text: shareText, url: shareLink }).catch(function () {});
          } else {
            try {
              const ta = document.createElement('textarea');
              ta.value = `${shareText} 👉 ${shareLink}`;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);

        changeModalQty: function (delta) {
          if (!state.selectedProductModal) return;
          const maxStock = Math.max(1, Number(state.selectedProductModal.stock_disponible) || 1);
          state.modalQuantity = Math.min(maxStock, Math.max(1, state.modalQuantity + delta));

        addToCart: function (id, qty) {
          const prod = state.products.find((p) => p.id === id);
          if (!prod || isSoldOut(prod)) return;
          const addQty = qty || 1;
          const existing = state.cart.find((c) => c.id === id);
          if (existing) {
            existing.quantity = Math.min(Number(prod.stock_disponible) || 1, existing.quantity + addQty);
          } else {
            state.cart.push(Object.assign({}, prod, { quantity: Math.min(Number(prod.stock_disponible) || 1, addQty) }));
          }
          saveLocal();
          showToast(`Agregado al combo: ${prod.titulo_producto}`, 'success');
          render();
        },
        updateCartQty: function (id, delta) {
          state.cart = state.cart
            .map(function (item) {
              if (item.id !== id) return item;
              const next = item.quantity + delta;
              if (next <= 0) return null;
              return Object.assign({}, item, { quantity: Math.min(Number(item.stock_disponible) || 99, next) });
            })
            .filter(Boolean);
          saveLocal();
          render();
        },
        toggleCart: function (open) {
          state.isCartOpen = open;
          render();
        },
        confirmDirectOrder: function (id) {
          const prod = state.products.find((p) => p.id === id);
          if (!prod || isSoldOut(prod)) return;
          const qty = state.modalQuantity;
          const totalPen = (Number(prod.precio_pen) * qty).toFixed(2);
          const storeTitle = `${state.config.storeName} ${state.config.storeSubtitle}`.trim();

          prod.stock_disponible = Math.max(0, (Number(prod.stock_disponible) || 0) - qty);
          prod.ultima_actividad_usuario = getNextUniqueAlias();
          prod.ultima_actividad_texto = state.lang === 'es' ? 'hace unos segundos' : 'just now';

          state.ordersHistory.unshift({
            id: 'ord-' + Date.now(),
            timestamp: new Date().toLocaleString('es-PE'),
            type: 'Compra Directa',
            customer: `${qty} cuenta(s) • ${state.selectedPaymentMethod}`,
            paymentMethod: state.selectedPaymentMethod,
            totalPen: totalPen,
            items: [{ id: prod.id, title: prod.titulo_producto, qty: qty }],
            restored: false,
            status: 'Enviado a WhatsApp'
          });

          saveLocal();
          pushCatalogToGitHubLive();

          const msg = (state.config.whatsappTemplateSingle || INITIAL_CONFIG.whatsappTemplateSingle)
            .replace('{tienda}', storeTitle)
            .replace('{producto}', prod.titulo_producto)
            .replace('{cantidad}', String(qty))
            .replace(/\{metodo_pago\}/g, state.selectedPaymentMethod)
            .replace('{duracion}', prod.duracion)
            .replace('{entrega}', prod.tipo_entrega)
            .replace('{total_pen}', totalPen);

          const phone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          render();
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');
        },
        askRestock: function (id) {
          const prod = state.products.find((p) => p.id === id);
          if (!prod) return;
          const storeTitle = `${state.config.storeName} ${state.config.storeSubtitle}`.trim();
          const msg = (state.config.whatsappTemplateRestock || INITIAL_CONFIG.whatsappTemplateRestock)
            .replace('{tienda}', storeTitle)
            .replace('{producto}', prod.titulo_producto)
            .replace('{duracion}', prod.duracion);
          const phone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');
        },
        sendComboOrder: function () {
          if (state.cart.length === 0) return;
          const storeTitle = `${state.config.storeName} ${state.config.storeSubtitle}`.trim();
          let totalPen = 0;
          let totalItems = 0;
          const lines = state.cart.map(function (item, idx) {
            const sub = Number(item.precio_pen) * item.quantity;
            totalPen += sub;
            totalItems += item.quantity;
            const realProd = state.products.find((p) => p.id === item.id);
            if (realProd) {
              realProd.stock_disponible = Math.max(0, (Number(realProd.stock_disponible) || 0) - item.quantity);
            }
            return `${idx + 1}. 📦 *${item.titulo_producto}*\n   🔢 Cantidad: *${item.quantity} cuenta(s)* - S/ ${sub.toFixed(2)}`;
          });

          const msg = (state.config.whatsappTemplateCombo || INITIAL_CONFIG.whatsappTemplateCombo)
            .replace('{tienda}', storeTitle)
            .replace('{lista_productos}', lines.join('\n\n'))
            .replace('{total_cuentas}', String(totalItems))
            .replace(/\{metodo_pago\}/g, state.selectedPaymentMethod)
            .replace('{total_pen}', totalPen.toFixed(2));

          state.ordersHistory.unshift({
            id: 'ord-' + Date.now(),
            timestamp: new Date().toLocaleString('es-PE'),
            type: 'Combo Carrito',
            customer: `Combo (${totalItems} cuentas)`,
            paymentMethod: state.selectedPaymentMethod,
            totalPen: totalPen.toFixed(2),
            items: state.cart.map((c) => ({ id: c.id, title: c.titulo_producto, qty: c.quantity })),
            restored: false,
            status: 'Enviado a WhatsApp'
          });

          state.cart = [];
          state.isCartOpen = false;
          saveLocal();
          pushCatalogToGitHubLive();
          render();

          const phone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');

            state.products.unshift({

              imagen_url: finalImg,
              descripcion: desc

          state.pendingProductImage = '';

          saveLocal();
          pushCatalogToGitHubLive();

          pushCatalogToGitHubLive();
          render();

        restoreOrderStock: function (ordId) {
          const ord = state.ordersHistory.find((o) => o.id === ordId);

          (ord.items || []).forEach(function (it) {

            if (p) p.stock_disponible = (Number(p.stock_disponible) || 0) + (Number(it.qty) || 1);
          });

          ord.status = 'Stock Devuelto';

          pushCatalogToGitHubLive();
          render();

          const list = state.config.categoriesList || ALL_CATEGORIES;
          if (!list.includes(val)) {

            pushCatalogToGitHubLive();
            render();

          showToast('¡Catálogo sincronizado en vivo para todos los celulares y navegadores!', 'success');
        },
        exportContentBackup: function () {
          const payload = {
            version: 'alpaca-content-backup-v2',
            exportedAt: new Date().toISOString(),
            config: state.config,
            platforms: state.platforms,
            products: state.products,
            ordersHistory: state.ordersHistory
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `alpaca-contenido-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showToast('Copia de seguridad (.json) descargada.', 'success');
        },
        importContentBackup: function (input) {
          const file = input.files && input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function (ev) {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (parsed.config) state.config = Object.assign({}, INITIAL_CONFIG, state.config, parsed.config);
              if (Array.isArray(parsed.platforms)) state.platforms = parsed.platforms;
              if (Array.isArray(parsed.products)) {
                const incoming = normalizeProductsPlatforms(parsed.products);
                const ids = new Set(incoming.map((x) => x.id));
                state.products = incoming.concat(state.products.filter((x) => !ids.has(x.id)));
              }
              if (Array.isArray(parsed.ordersHistory)) state.ordersHistory = parsed.ordersHistory;
              saveLocal();
              pushCatalogToGitHubLive();
              render();
              showToast('¡Contenido restaurado y sincronizado sobre la web vigente!', 'success');
            } catch (err) {
              showToast('Error al leer el archivo .json', 'error');
            }
          };
          reader.readAsText(file);
        },
        downloadFullIndexHtml: function () {
          const clone = document.documentElement.cloneNode(true);
          const appDiv = clone.querySelector('#app');
          if (appDiv) appDiv.innerHTML = '';
          const bannerDiv = clone.querySelector('#live-banner-layer');
          if (bannerDiv) bannerDiv.innerHTML = '';
          const toastDiv = clone.querySelector('#toast-layer');
          if (toastDiv) toastDiv.innerHTML = '';

          let embScript = clone.querySelector('#alpaca-embedded-data');
          if (!embScript) {
            embScript = document.createElement('script');
            embScript.id = 'alpaca-embedded-data';
            clone.querySelector('body').insertBefore(embScript, clone.querySelector('body script'));
          }
          const safeJson = JSON.stringify({
            buildStamp: 'build-' + Date.now(),
            config: state.config,
            platforms: state.platforms,
            products: state.products,
            ordersHistory: state.ordersHistory
          }).replace(/<\//g, '<\\/');
          embScript.textContent = 'window.__ALPACA_EMBEDDED_STATE__ = ' + safeJson + ';';

          const finalHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
          const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showToast('¡Archivo index.html Todo-en-Uno descargado para GitHub Pages!', 'success');
        }
      };

      // ==========================================

            const activePlatObj = visPlats.find((pl) => pl.id === state.selectedPlatform);
            const targetCat = activePlatObj ? activePlatObj.category : 'Streaming';
            displayedPlatforms = visPlats.filter((pl) => pl.id === 'all' || pl.id === state.selectedPlatform || pl.category === targetCat);
          } else if (state.selectedCategory !== 'Todos') {
            const matching = visPlats.filter((pl) => pl.id === 'all' || pl.category === state.selectedCategory);
            if (matching.length > 1) displayedPlatforms = matching;
          }

          const q = (state.searchQuery || '').trim().toLowerCase();
          const matchQ =
            !q ||
            String(p.titulo_producto || '').toLowerCase().includes(q) ||
            String(p.proveedor_nombre || '').toLowerCase().includes(q);
          const matchStock = !state.onlyInStock || !isSoldOut(p);
          return matchCat && matchPlat && matchQ && matchStock;

        let cartTotalItems = 0;

                    </div>
                    <div class="flex items-center gap-1 mt-0.5">
                      <span class="font-calc text-[11px] font-bold tracking-[0.26em] ${state.darkMode ? 'text-white' : 'text-slate-800'}">${esc(state.config.storeSubtitle)}</span>
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>

                          <span class="w-5 text-center font-bold">${c.quantity}</span>
                          <button onclick="window.appActions.updateCartQty('${esc(c.id)}', 1)" class="w-6 h-6 rounded bg-zinc-800 text-white">+</button>
                        </div>
                      </div>
                    `).join('')}
                    <div>
                      <label class="block font-calc text-xs font-bold text-emerald-500 mb-1.5">💳 ${t.paymentMethodLabel}</label>
                      <div class="grid grid-cols-3 gap-1.5">
                        ${(state.config.paymentMethods || INITIAL_CONFIG.paymentMethods).map((m) => `<button type="button" onclick="window.appActions.selectPayment('${esc(m)}')" class="py-1.5 px-2 rounded-lg font-calc text-[11px] font-bold border ${state.selectedPaymentMethod === m ? 'bg-emerald-500 text-black border-emerald-400 font-extrabold' : 'bg-zinc-900 text-zinc-300 border-zinc-800'}">${esc(m)}</button>`).join('')}
                      </div>
                    </div>
                  `}
                </div>
                ${state.cart.length > 0 ? `
                  <div class="p-4 border-t space-y-2.5 ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'}">
                    <div class="flex items-center justify-between font-calc">
                      <span class="text-xs ${textMuted}">Total a Pagar:</span>
                      <span class="font-num text-base font-extrabold">S/ ${cartTotalPen.toFixed(2)}</span>
                    </div>
                    <button onclick="window.appActions.sendComboOrder()" class="w-full py-2.5 rounded-xl bg-emerald-500 text-black font-calc font-extrabold text-xs">💬 ${t.sendWhatsAppOrder}</button>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          <!-- MODAL ACCESO PRIVADO (ALT + A O DOBLE CLIC EN LOGO INFERIOR) -->
          ${state.isLoginModalOpen ? `
            <div onclick="window.appActions.closeLogin()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div onclick="event.stopPropagation()" class="w-full max-w-sm rounded-2xl bg-[#151114] border border-zinc-800 p-5 space-y-4 text-zinc-100 shadow-2xl">
                <div class="flex items-center justify-between">
                  <h3 class="font-calc text-sm font-extrabold text-emerald-400">🔒 Acceso Interno Autorizado</h3>
                  <button onclick="window.appActions.closeLogin()">✕</button>
                </div>
                <form onsubmit="window.appActions.submitLogin(event)" class="space-y-3 text-xs">
                  <div>
                    <label class="block font-calc font-bold text-zinc-300 mb-1">Correo Electrónico</label>
                    <input id="login-email-input" type="email" required placeholder="Tu correo autorizado" class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-white" />
                  </div>
                  <div>
                    <label class="block font-calc font-bold text-zinc-300 mb-1">Contraseña</label>
                    <input id="login-pass-input" type="password" required placeholder="••••••••" class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-white" />
                  </div>
                  ${state.loginError ? `<div class="text-[11px] text-red-400 font-bold">${esc(state.loginError)}</div>` : ''}
                  <button type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 text-black font-calc font-extrabold text-xs">Ingresar al Panel de Control</button>
                </form>
              </div>
            </div>
          ` : ''}

          <!-- BOTÓN FLOTANTE INFERIOR DERECHO -->
          <button onclick="window.appActions.toggleCart(true)" style="background-color:${state.config.primaryColor}" class="fixed bottom-3.5 right-3.5 z-40 px-3.5 py-2 rounded-lg text-white font-calc font-bold text-xs shadow-xl flex items-center gap-1.5">
            <span>🎧</span>
            <span>${cartTotalItems > 0 ? 'Combo (' + cartTotalItems + ') • S/ ' + cartTotalPen.toFixed(2) : 'Soporte'}</span>
          </button>
        `;
      }

      // Atajo Alt + A para abrir acceso interno y soporte de enlace compartido ?producto=ID
      window.addEventListener('keydown', function (e) {
        if (e.altKey && e.key.toLowerCase() === 'a') {
          e.preventDefault();
          window.appActions.openLogin();
        } else if (e.key === 'Escape') {
          state.selectedProductModal = null;
          state.isCartOpen = false;
          state.isLoginModalOpen = false;
          render();
        }
      });

      const params = new URLSearchParams(window.location.search);
      const sharedProdId = params.get('producto');
      if (sharedProdId) {
        const foundShared = state.products.find((p) => p.id === sharedProdId);
        if (foundShared) state.selectedProductModal = foundShared;
      }

      render();
      fetchLiveCloudCatalog();
    })();
  </script>

</body></html>
