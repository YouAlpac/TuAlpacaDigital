      function loadLocal(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(fallback));
        } catch (e) {
          return JSON.parse(JSON.stringify(fallback));
        }
      }

      function saveLocal() {
        try {
          localStorage.setItem('alpaca_zeyn_config_v2', JSON.stringify(state.config));
          localStorage.setItem('alpaca_zeyn_platforms_v2', JSON.stringify(state.platforms));
          localStorage.setItem('alpaca_zeyn_products_v2', JSON.stringify(state.products));
          localStorage.setItem('alpaca_zeyn_cart_v2', JSON.stringify(state.cart));
          localStorage.setItem('alpaca_zeyn_orders_history_v1', JSON.stringify(state.ordersHistory));
        } catch (e) {}
      }

      function loadSession(key, fallback) {
        try {
          const raw = sessionStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
          return fallback;
        }
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function isProductSoldOut(p) {
        if (!p) return true;

      // 6. COLA BARAJADA DE +128 ALIAS SIN CIUDADES NI REPETICIÓN
      let aliasQueue = [];
      function getNextUniqueAlias() {
        if (aliasQueue.length === 0) {
          aliasQueue = BUYER_ALIASES_DB.slice();
          for (let i = aliasQueue.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = aliasQueue[i];
            aliasQueue[i] = aliasQueue[j];
            aliasQueue[j] = temp;
          }
        }
        return aliasQueue.pop();
      }

      // Notificaciones flotantes pausadas cada 32 segundos (Actualizan su propia capa sin reiniciar el scroll del Popup)
      function triggerRandomActivity() {
        const activeProds = state.products.filter((p) => p.visible !== false && !isProductSoldOut(p));
        if (!activeProds.length || state.activeTab !== 'catalogo' || state.selectedProductModal) return;
        const randomProd = activeProds[Math.floor(Math.random() * activeProds.length)];
        const isNewStock = Math.random() > 0.55;
        const uniqueBuyer = getNextUniqueAlias();
        const randomAdded = Math.floor(Math.random() * 3) + 2;

        state.liveActivityBanner = {
          id: Date.now(),
          productId: randomProd.id,
          imagen_url: randomProd.imagen_url,
          title: isNewStock
            ? `🔥 Nuevo stock ingresado (+${randomAdded} cuentas)`
            : `⚡ Compra reciente verificada`,
          subtitle: isNewStock
            ? `${randomProd.titulo_producto} • S/ ${Number(randomProd.precio_pen).toFixed(2)}`
            : `@${uniqueBuyer} adquirió ${randomProd.titulo_producto}`
        };
        renderLiveBannerLayer();

        setTimeout(() => {
          if (state.liveActivityBanner && Date.now() - state.liveActivityBanner.id >= 6200) {
            state.liveActivityBanner = null;
            renderLiveBannerLayer();
          }
        }, 6500);
      }

      // 8. EXPORTADOR DEL MISMO ARCHIVO INDEX.HTML Y SISTEMA DE BACKUP (.JSON)
      window.downloadUpdatedIndexHtml = function () {
        const cloneDoc = document.documentElement.cloneNode(true);
        const appContainer = cloneDoc.querySelector('#app');
        if (appContainer) appContainer.innerHTML = '';
        const bannerLayer = cloneDoc.querySelector('#live-banner-layer');
        if (bannerLayer) bannerLayer.innerHTML = '';
        const toastLayer = cloneDoc.querySelector('#toast-layer');
        if (toastLayer) toastLayer.innerHTML = '';
        const embeddedScript = cloneDoc.querySelector('#alpaca-embedded-data');
        if (embeddedScript) {
          const payload = {
            config: state.config,
            platforms: state.platforms,
            products: state.products
          };
          embeddedScript.textContent = '\n    window.__ALPACA_EMBEDDED_STATE__ = ' + JSON.stringify(payload) + ';\n  ';
        }
        const finalHtml = '<!DOCTYPE html>\n' + cloneDoc.outerHTML;
        const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Nuevo index.html descargado con todos tus productos y fotos integrados.', 'success');
      };

      // Exportar Backup Completo (.json) para no perder productos al actualizar la web
      window.exportBackupJson = function () {
        const backupPayload = {
          version: 'alpaca-backup-v2',
          exportedAt: new Date().toISOString(),
          config: state.config,
          platforms: state.platforms,
          products: state.products,
          ordersHistory: state.ordersHistory
        };
        const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'alpaca-digital-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Backup (.json) descargado. Guárdalo para restaurar tus productos cuando quieras.', 'success');
      };

      // Importar Backup Completo (.json)
      window.importBackupJson = function (input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed.config) state.config = { ...INITIAL_CONFIG, ...parsed.config };
            if (Array.isArray(parsed.platforms)) state.platforms = parsed.platforms;
            if (Array.isArray(parsed.products)) state.products = parsed.products;
            if (Array.isArray(parsed.ordersHistory)) state.ordersHistory = parsed.ordersHistory;
            saveLocal();
            render();
            showToast('¡Backup restaurado! Todos tus productos, iconos y categorías fueron cargados.', 'success');
          } catch (err) {
            showToast('El archivo seleccionado no es un Backup válido.', 'error');
          }
        };
        reader.readAsText(file);
      };

      // Función universal para compartir Producto o Tienda con enlace directo (?producto=ID)
      function shareUrlOrText(title, text, url) {
        if (navigator.share) {
          navigator.share({ title, text, url }).catch(() => {});
          return;
        }
        const fullCopy = `${text}\n👉 ${url}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(fullCopy).then(() => {
            showToast('Enlace del producto copiado para compartir.', 'success');
          }).catch(() => fallbackCopyText(fullCopy));
        } else {
          fallbackCopyText(fullCopy);
        }
      }

      function fallbackCopyText(str) {
        const ta = document.createElement('textarea');
        ta.value = str;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        showToast('Enlace copiado al portapapeles.', 'success');
      }

          state.selectedPaymentMethod = method;
          render();
          const nextScrollEl = document.getElementById('product-modal-scroll');
          if (nextScrollEl) nextScrollEl.scrollTop = prevScroll;
        },
        addToCart(prodId, qty) {
          qty = qty || 1;
          const prod = state.products.find((p) => p.id === prodId);
          if (!prod || isProductSoldOut(prod)) {
            showToast('Este producto está Agotado.', 'error');
            return;
          }
          const existing = state.cart.find((c) => c.id === prodId);
          if (existing) {
            existing.quantity = Math.min(prod.stock_disponible, existing.quantity + qty);
          } else {
            state.cart.push({ ...prod, quantity: Math.min(prod.stock_disponible, qty) });
          }
          saveLocal();
          showToast('Agregado al combo: ' + prod.titulo_producto, 'success');
        },
        updateCartQty(prodId, delta) {
          state.cart = state.cart
            .map((item) => {
              if (item.id !== prodId) return item;
              const next = item.quantity + delta;
              if (next <= 0) return null;
              return { ...item, quantity: Math.min(item.stock_disponible, next) };
            })
            .filter(Boolean);
          saveLocal();
          render();
        },
        toggleCart(open) {
          state.isCartOpen = open;
          render();
        },
        confirmDirectOrder(prodId) {
          const prod = state.products.find((p) => p.id === prodId);
          if (!prod || isProductSoldOut(prod)) return;
          const qty = state.modalQuantity;
          const totalPen = (Number(prod.precio_pen) * qty).toFixed(2);
          const cleanPhone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          const storeTitle = (state.config.storeName + ' ' + state.config.storeSubtitle).trim();

          // Descontar stock automáticamente
          prod.stock_disponible = Math.max(0, (Number(prod.stock_disponible) || 0) - qty);
          prod.ultima_actividad_usuario = getNextUniqueAlias();
          prod.ultima_actividad_texto = state.lang === 'es' ? 'hace unos segundos' : 'just now';

          state.ordersHistory.unshift({
            id: 'ord-' + Date.now(),
            timestamp: new Date().toLocaleString('es-PE'),
            type: 'Compra Directa',
            customer: qty + ' cuenta(s) • ' + state.selectedPaymentMethod,
            paymentMethod: state.selectedPaymentMethod,
            totalPen: totalPen,
            items: [{ id: prod.id, title: prod.titulo_producto, qty: qty }],
            restored: false,
            status: 'Enviado a WhatsApp'
          });
          saveLocal();

          const msg = (state.config.whatsappTemplateSingle || INITIAL_CONFIG.whatsappTemplateSingle)
            .replace('{tienda}', storeTitle)
            .replace('{producto}', prod.titulo_producto)
            .replace('{duracion}', prod.duracion)
            .replace('{entrega}', prod.tipo_entrega)
            .replace('{cantidad}', String(qty))
            .replace('{total_pen}', totalPen)
            .replace(/\{metodo_pago\}/g, state.selectedPaymentMethod);

          render();
          window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
        },
        askRestockWhatsApp(prodId) {
          const prod = state.products.find((p) => p.id === prodId);
          if (!prod) return;
          const cleanPhone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          const storeTitle = (state.config.storeName + ' ' + state.config.storeSubtitle).trim();
          const msg = (state.config.whatsappTemplateRestock || INITIAL_CONFIG.whatsappTemplateRestock)
            .replace('{tienda}', storeTitle)
            .replace('{producto}', prod.titulo_producto)
            .replace('{duracion}', prod.duracion);
          window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
        },
        sendComboWhatsApp() {
          if (!state.cart.length) return;
          const cleanPhone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          const totalPen = state.cart.reduce((a, i) => a + i.precio_pen * i.quantity, 0).toFixed(2);
          const totalItems = state.cart.reduce((a, i) => a + i.quantity, 0);
          const list = state.cart
            .map((item, idx) => `${idx + 1}. 📦 *${item.titulo_producto}*\n   🔢 Cantidad: *${item.quantity} cuenta(s)* (${item.tipo_entrega} • ${item.duracion}) - S/ ${(item.precio_pen * item.quantity).toFixed(2)}`)
            .join('\n\n');
          const storeTitle = (state.config.storeName + ' ' + state.config.storeSubtitle).trim();
          const msg = (state.config.whatsappTemplateCombo || INITIAL_CONFIG.whatsappTemplateCombo)
            .replace('{tienda}', storeTitle)
            .replace('{lista_productos}', list)
            .replace('{total_cuentas}', String(totalItems))
            .replace('{total_pen}', totalPen)
            .replace(/\{metodo_pago\}/g, state.selectedPaymentMethod);

          state.cart.forEach((cItem) => {
            const target = state.products.find((p) => p.id === cItem.id);
            if (target) {
              target.stock_disponible = Math.max(0, (Number(target.stock_disponible) || 0) - cItem.quantity);
              target.ultima_actividad_usuario = getNextUniqueAlias();
              target.ultima_actividad_texto = 'hace unos segundos';
            }
          });

          state.ordersHistory.unshift({
            id: 'ord-' + Date.now(),
            timestamp: new Date().toLocaleString('es-PE'),
            type: 'Combo Carrito',
            customer: 'Combo (' + totalItems + ' cuentas)',
            paymentMethod: state.selectedPaymentMethod,
            totalPen: totalPen,
            items: state.cart.map((i) => ({ id: i.id, title: i.titulo_producto, qty: i.quantity })),
            restored: false,
            status: 'Enviado a WhatsApp'
          });

          state.cart = [];
          state.isCartOpen = false;
          saveLocal();
          render();
          window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
        },
        openSecretLogin() {
          if (state.loggedPartner) {
            state.activeTab = state.activeTab === 'admin' ? 'catalogo' : 'admin';
          } else {
            state.isLoginModalOpen = true;
            state.loginError = '';
          }
          render();
        },
        closeLoginModal() {
          state.isLoginModalOpen = false;
          render();
        },
        submitLogin(e) {

          const pass = document.getElementById('login-pass').value;
          const partners = state.config.partners || INITIAL_CONFIG.partners;
          const matched = partners.find((u) => u.email.toLowerCase().trim() === email && u.pass === pass);
          if (!matched) {
            state.loginError = 'Correo o contraseña incorrectos.';
            render();
            return;
          }
          state.loggedPartner = matched;
          sessionStorage.setItem('alpaca_partner_session', JSON.stringify(matched));
          state.isLoginModalOpen = false;
          state.activeTab = 'admin';
          showToast('Bienvenido, ' + matched.name, 'success');
        },
        logoutPartner() {
          state.loggedPartner = null;
          sessionStorage.removeItem('alpaca_partner_session');

          showToast('Sesión cerrada.', 'info');

        // Acciones del Panel Admin
        adjustStock(prodId, delta) {

          render();

          const p = state.products.find((x) => x.id === prodId);

          saveLocal();
          render();

        saveProductForm(e) {
          e.preventDefault();
          const title = document.getElementById('pf-title').value.trim();

          const plat = document.getElementById('pf-plat').value;

          const desc = document.getElementById('pf-desc').value;

          if (state.editingProductId) {
            const target = state.products.find((x) => x.id === state.editingProductId);

          } else {
            state.products.unshift({
              id: 'prod-' + Date.now(),
              titulo_producto: title,
              categoria: cat,
              plataforma_id: plat,
              proveedor_nombre: state.config.ownerUser,
              precio_pen: price,
              stock_disponible: stock,
              visible: true,
              modo_agotado: modo,

              duracion: dur,

              imagen_url: uploadedImg || createProductCardArt(Date.now(), '#111827', '#1e293b', state.config.primaryColor, ent.toUpperCase(), title.slice(0, 15).toUpperCase(), dur.toUpperCase(), '🦙'),

        handleProdFile(input) {
          const file = input.files && input.files[0];
          if (!file) return;
          compressImageFile(file, 480, (b64) => {
            window.__TEMP_PROD_IMG__ = b64;

            const previewImg = document.getElementById('pf-img-preview');
            const previewBadge = document.getElementById('pf-img-status');
            if (previewImg) {
              previewImg.src = b64;
              previewImg.classList.remove('hidden');
            }
            if (previewBadge) {
              previewBadge.textContent = '✓ Imagen cargada y lista para publicar (tus datos siguen intactos)';
              previewBadge.className = 'text-[11px] font-calc font-bold text-emerald-400 mt-1 block';
            }
            showToast('Imagen lista. Ahora haz clic en Publicar Producto.', 'success');

        savePlatformForm(e) {

          const name = document.getElementById('plf-name').value.trim();
          if (!name) return;
          const sym = (document.getElementById('plf-sym').value.trim() || name.slice(0, 3)).toUpperCase();
          const bg = document.getElementById('plf-bg').value || '#e11d48';
          const img = window.__TEMP_PLAT_IMG__ || createPlatformBadgeSvg(bg, '#ffffff', sym, '');
          state.platforms.push({
            id: 'plat-' + Date.now(),

          });
          window.__TEMP_PLAT_IMG__ = '';
          saveLocal();
          showToast('Icono añadido a la barra compacta.', 'success');

        addCategory(e) {
          e.preventDefault();
          const val = document.getElementById('new-cat-input').value.trim();
          if (!val) return;

          if (!list.includes(val)) {
            state.config.categoriesList = [...list, val];

        },
        removeCategory(cat) {
          if (cat === 'Todos') return;
          state.config.categoriesList = getCategoriesList().filter((c) => c !== cat);
          if (state.selectedCategory === cat) state.selectedCategory = 'Todos';
          saveLocal();
          render();

          state.config.whatsappNumber = document.getElementById('cfg-wa').value.trim();
          state.config.scheduleText = document.getElementById('cfg-sch').value.trim();
          saveLocal();
          showToast('WhatsApp y horario actualizados.', 'success');

        restoreOrderStock(ordId) {
          const ord = state.ordersHistory.find((o) => o.id === ordId);
          if (!ord || ord.restored) return;
          (ord.items || []).forEach((it) => {
            const p = state.products.find((x) => x.id === it.id);
            if (p) p.stock_disponible = (Number(p.stock_disponible) || 0) + (Number(it.qty) || 1);
          });
          ord.restored = true;
          ord.status = 'Stock Devuelto';
          saveLocal();
          showToast('Stock devuelto al inventario.', 'success');
        }
      };

      function compressImageFile(file, maxDim, cb) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            cb(canvas.toDataURL('image/webp', 0.82));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      // Atajo de Teclado Alt + A para abrir Login Privado
      window.addEventListener('keydown', (e) => {
        if (e.altKey && e.key.toLowerCase() === 'a') {
          e.preventDefault();
          window.appActions.openSecretLogin();
        } else if (e.key === 'Escape') {
          state.selectedProductModal = null;
          state.isLoginModalOpen = false;
          state.isCartOpen = false;
          render();
        }
      });

      // 10. RENDERIZADO DEL CATÁLOGO Y MODALES
      function getFilteredProducts() {
        return (state.products || []).filter((p) => {
          if (!p || p.visible === false) return false;
          const soldOut = isProductSoldOut(p);
          const matchCat = state.selectedCategory === 'Todos' || p.categoria === state.selectedCategory;
          const matchPlat = state.selectedPlatform === 'all' || p.plataforma_id === state.selectedPlatform;
          const q = String(state.searchQuery || '').trim().toLowerCase();
          const title = String(p.titulo_producto || '').toLowerCase();
          const prov = String(p.proveedor_nombre || '').toLowerCase();
          const cat = String(p.categoria || '').toLowerCase();
          const matchQuery = !q || title.includes(q) || prov.includes(q) || cat.includes(q);
          const matchStock = !state.onlyInStock || !soldOut;
          return matchCat && matchPlat && matchQuery && matchStock;
        });
      }

                <div class="p-4 border-b flex items-center justify-between ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'}">
                  <h3 class="font-calc text-sm font-extrabold">🛒 ${t.comboTitle}</h3>
                  <button onclick="appActions.toggleCart(false)">✕</button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-3">
                  ${state.cart.length === 0 ? `<div class="text-center py-12 text-xs text-zinc-500 font-calc">${t.emptyCombo}</div>` : state.cart.map((item) => `
                    <div class="p-2.5 rounded-xl border flex items-center justify-between gap-2 ${state.darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-slate-50 border-slate-200'}">
                      <div class="flex items-center gap-2 min-w-0">
                        <img src="${item.imagen_url}" class="w-10 h-10 rounded object-cover" />
                        <div class="min-w-0">
                          <div class="font-calc text-xs font-bold truncate">${escapeHtml(item.titulo_producto)}</div>
                          <div class="font-num text-[11px] text-emerald-500 font-bold">S/ ${Number(item.precio_pen).toFixed(2)} c/u</div>
                        </div>
                      </div>
                      <div class="flex items-center gap-1 font-num text-xs">
                        <button onclick="appActions.updateCartQty('${item.id}', -1)" class="w-6 h-6 rounded bg-zinc-800 text-white">-</button>
                        <span class="w-5 text-center font-bold">${item.quantity}</span>
                        <button onclick="appActions.updateCartQty('${item.id}', 1)" class="w-6 h-6 rounded bg-zinc-800 text-white">+</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
                ${state.cart.length > 0 ? `
                  <div class="p-4 border-t space-y-2.5 ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'}">
                    <div class="flex items-center justify-between font-calc">
                      <span class="text-xs">Total a Pagar:</span>
                      <span class="font-num text-base font-extrabold">S/ ${totalPen}</span>
                    </div>
                    <button onclick="appActions.sendComboWhatsApp()" class="w-full py-2.5 rounded-xl bg-emerald-500 text-black font-calc font-extrabold text-xs">
                      💬 ${t.sendWhatsAppOrder} (${escapeHtml(state.selectedPaymentMethod)})
                    </button>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          <!-- 5. LOGIN PRIVADO (SIN MOSTRAR CLAVES AL PÚBLICO) -->
          ${state.isLoginModalOpen ? `
            <div onclick="appActions.closeLoginModal()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div onclick="event.stopPropagation()" class="w-full max-w-sm rounded-2xl bg-[#151114] border border-zinc-800 p-5 space-y-4 text-zinc-100">
                <div class="flex items-center justify-between">
                  <h3 class="font-calc text-sm font-extrabold text-emerald-400">🔒 Acceso Interno Autorizado</h3>
                  <button onclick="appActions.closeLoginModal()">✕</button>
                </div>
                <form onsubmit="appActions.submitLogin(event)" class="space-y-3 text-xs">
                  <div>
                    <label class="block font-calc font-bold text-zinc-300 mb-1">Correo Electrónico</label>
                    <input id="login-email" type="email" required placeholder="Tu correo autorizado" class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-white" />
                  </div>
                  <div>
                    <label class="block font-calc font-bold text-zinc-300 mb-1">Contraseña</label>
                    <input id="login-pass" type="password" required placeholder="••••••••" class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-white" />
                  </div>
                  ${state.loginError ? `<div class="text-red-400 font-bold">${escapeHtml(state.loginError)}</div>` : ''}
                  <button type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 text-black font-calc font-extrabold">Ingresar al Panel</button>
                </form>
              </div>
            </div>
          ` : ''}

          <!-- Botón Flotante Inferior Derecho -->
          <button onclick="appActions.toggleCart(true)" style="background-color:${state.config.primaryColor}" class="fixed bottom-3.5 right-3.5 z-40 px-3.5 py-2 rounded-lg text-white font-calc font-bold text-xs shadow-xl flex items-center gap-1.5">
            <span>🎧 ${totalItems > 0 ? `Combo (${totalItems}) • S/ ${totalPen}` : 'Soporte'}</span>
          </button>
        `;
      }

      // Si alguien entra con un enlace compartido (?producto=ID), abrir automáticamente el popup de ese producto
      try {
        const params = new URLSearchParams(window.location.search);
        const sharedProdId = params.get('producto');
        if (sharedProdId) {
          const foundShared = state.products.find((p) => p.id === sharedProdId);
          if (foundShared) {
            state.selectedProductModal = foundShared;
            state.modalQuantity = 1;
          }
        }
      } catch (e) {}

      render();
      renderLiveBannerLayer();
    })();
  </script>

</body></html>
