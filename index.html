      function loadLocal(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(fallback));
        } catch (e) {
          return JSON.parse(JSON.stringify(fallback));
        }
      }

      function saveLocal() {
        try {
          localStorage.setItem('alpaca_zeyn_config_v2', JSON.stringify(state.config));
          localStorage.setItem('alpaca_zeyn_platforms_v2', JSON.stringify(state.platforms));
          localStorage.setItem('alpaca_zeyn_products_v2', JSON.stringify(state.products));
          localStorage.setItem('alpaca_zeyn_cart_v2', JSON.stringify(state.cart));
          localStorage.setItem('alpaca_zeyn_orders_history_v1', JSON.stringify(state.ordersHistory));
        } catch (e) {}
      }

      function loadSession(key, fallback) {
        try {
          const raw = sessionStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
          return fallback;
        }
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function isProductSoldOut(p) {
        if (!p) return true;
        return p.modo_agotado === 'manual_agotado' || Number(p.stock_disponible) <= 0;
      }

      function getCategoriesList() {
        const base = Array.isArray(state.config.categoriesList) && state.config.categoriesList.length
          ? state.config.categoriesList
          : ALL_CATEGORIES;
        const withVideo = base.includes('Video') ? base : [...base.slice(0, 3), 'Video', ...base.slice(3)];
        return withVideo.includes('Todos') ? withVideo : ['Todos', ...withVideo];
      }

      let aliasQueue = [];
      function getNextUniqueAlias() {
        if (aliasQueue.length === 0) {
          aliasQueue = BUYER_ALIASES_DB.slice();
          for (let i = aliasQueue.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = aliasQueue[i];
            aliasQueue[i] = aliasQueue[j];
            aliasQueue[j] = temp;
          }
        }
        return aliasQueue.pop();
      }

        const activeProds = state.products.filter((p) => p.visible !== false && !isProductSoldOut(p));

        const randomProd = activeProds[Math.floor(Math.random() * activeProds.length)];
        const isNewStock = Math.random() > 0.55;
        const uniqueBuyer = getNextUniqueAlias();
        const randomAdded = Math.floor(Math.random() * 3) + 2;

        state.liveActivityBanner = {
          id: Date.now(),
          productId: randomProd.id,
          imagen_url: randomProd.imagen_url,
          title: isNewStock
            ? `🔥 Nuevo stock ingresado (+${randomAdded} cuentas)`
            : `⚡ Compra reciente verificada`,
          subtitle: isNewStock
            ? `${randomProd.titulo_producto} • S/ ${Number(randomProd.precio_pen).toFixed(2)}`
            : `@${uniqueBuyer} adquirió ${randomProd.titulo_producto}`
        };
        render();

        setTimeout(() => {
          if (state.liveActivityBanner && Date.now() - state.liveActivityBanner.id >= 6200) {
            state.liveActivityBanner = null;
            render();
          }
        }, 6500);

      // 8. EXPORTADOR DEL MISMO ARCHIVO INDEX.HTML CON LOS CAMBIOS INCRUSTADOS
      window.downloadUpdatedIndexHtml = function () {
        const cloneDoc = document.documentElement.cloneNode(true);
        const appContainer = cloneDoc.querySelector('#app');
        if (appContainer) appContainer.innerHTML = '';
        const embeddedScript = cloneDoc.querySelector('#alpaca-embedded-data');
        if (embeddedScript) {
          const payload = {
            config: state.config,
            platforms: state.platforms,
            products: state.products
          };
          embeddedScript.textContent = '\n    window.__ALPACA_EMBEDDED_STATE__ = ' + JSON.stringify(payload) + ';\n  ';
        }
        const finalHtml = '<!DOCTYPE html>\n' + cloneDoc.outerHTML;
        const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Nuevo index.html descargado con todos tus productos y fotos integrados.', 'success');
      };

          render();

        closeProductModal() {

          render();
        },
        changeModalQty(delta) {
          if (!state.selectedProductModal) return;
          const max = Math.max(1, Number(state.selectedProductModal.stock_disponible) || 1);
          state.modalQuantity = Math.min(max, Math.max(1, state.modalQuantity + delta));
          render();
        },
        selectPayment(method) {
          state.selectedPaymentMethod = method;
          render();
        },
        addToCart(prodId, qty) {
          qty = qty || 1;
          const prod = state.products.find((p) => p.id === prodId);
          if (!prod || isProductSoldOut(prod)) {
            showToast('Este producto está Agotado.', 'error');
            return;
          }
          const existing = state.cart.find((c) => c.id === prodId);
          if (existing) {
            existing.quantity = Math.min(prod.stock_disponible, existing.quantity + qty);
          } else {
            state.cart.push({ ...prod, quantity: Math.min(prod.stock_disponible, qty) });
          }
          saveLocal();
          showToast('Agregado al combo: ' + prod.titulo_producto, 'success');
        },
        updateCartQty(prodId, delta) {
          state.cart = state.cart
            .map((item) => {
              if (item.id !== prodId) return item;
              const next = item.quantity + delta;
              if (next <= 0) return null;
              return { ...item, quantity: Math.min(item.stock_disponible, next) };
            })
            .filter(Boolean);
          saveLocal();
          render();
        },
        toggleCart(open) {
          state.isCartOpen = open;
          render();
        },
        confirmDirectOrder(prodId) {
          const prod = state.products.find((p) => p.id === prodId);
          if (!prod || isProductSoldOut(prod)) return;
          const qty = state.modalQuantity;
          const totalPen = (Number(prod.precio_pen) * qty).toFixed(2);
          const cleanPhone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          const storeTitle = (state.config.storeName + ' ' + state.config.storeSubtitle).trim();

          // Descontar stock automáticamente
          prod.stock_disponible = Math.max(0, (Number(prod.stock_disponible) || 0) - qty);
          prod.ultima_actividad_usuario = getNextUniqueAlias();
          prod.ultima_actividad_texto = state.lang === 'es' ? 'hace unos segundos' : 'just now';

          state.ordersHistory.unshift({
            id: 'ord-' + Date.now(),
            timestamp: new Date().toLocaleString('es-PE'),
            type: 'Compra Directa',
            customer: qty + ' cuenta(s) • ' + state.selectedPaymentMethod,
            paymentMethod: state.selectedPaymentMethod,
            totalPen: totalPen,
            items: [{ id: prod.id, title: prod.titulo_producto, qty: qty }],
            restored: false,
            status: 'Enviado a WhatsApp'
          });
          saveLocal();

          const msg = (state.config.whatsappTemplateSingle || INITIAL_CONFIG.whatsappTemplateSingle)
            .replace('{tienda}', storeTitle)
            .replace('{producto}', prod.titulo_producto)
            .replace('{duracion}', prod.duracion)
            .replace('{entrega}', prod.tipo_entrega)
            .replace('{cantidad}', String(qty))
            .replace('{total_pen}', totalPen)
            .replace(/\{metodo_pago\}/g, state.selectedPaymentMethod);

          render();
          window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
        },
        askRestockWhatsApp(prodId) {
          const prod = state.products.find((p) => p.id === prodId);
          if (!prod) return;
          const cleanPhone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          const storeTitle = (state.config.storeName + ' ' + state.config.storeSubtitle).trim();
          const msg = (state.config.whatsappTemplateRestock || INITIAL_CONFIG.whatsappTemplateRestock)
            .replace('{tienda}', storeTitle)
            .replace('{producto}', prod.titulo_producto)
            .replace('{duracion}', prod.duracion);
          window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
        },
        sendComboWhatsApp() {
          if (!state.cart.length) return;
          const cleanPhone = (state.config.whatsappNumber || '').replace(/\D/g, '');
          const totalPen = state.cart.reduce((a, i) => a + i.precio_pen * i.quantity, 0).toFixed(2);
          const totalItems = state.cart.reduce((a, i) => a + i.quantity, 0);
          const list = state.cart
            .map((item, idx) => `${idx + 1}. 📦 *${item.titulo_producto}*\n   🔢 Cantidad: *${item.quantity} cuenta(s)* (${item.tipo_entrega} • ${item.duracion}) - S/ ${(item.precio_pen * item.quantity).toFixed(2)}`)
            .join('\n\n');
          const storeTitle = (state.config.storeName + ' ' + state.config.storeSubtitle).trim();
          const msg = (state.config.whatsappTemplateCombo || INITIAL_CONFIG.whatsappTemplateCombo)
            .replace('{tienda}', storeTitle)
            .replace('{lista_productos}', list)
            .replace('{total_cuentas}', String(totalItems))
            .replace('{total_pen}', totalPen)
            .replace(/\{metodo_pago\}/g, state.selectedPaymentMethod);

          state.cart.forEach((cItem) => {
            const target = state.products.find((p) => p.id === cItem.id);
            if (target) {
              target.stock_disponible = Math.max(0, (Number(target.stock_disponible) || 0) - cItem.quantity);
              target.ultima_actividad_usuario = getNextUniqueAlias();
              target.ultima_actividad_texto = 'hace unos segundos';
            }
          });

          state.ordersHistory.unshift({
            id: 'ord-' + Date.now(),
            timestamp: new Date().toLocaleString('es-PE'),
            type: 'Combo Carrito',
            customer: 'Combo (' + totalItems + ' cuentas)',
            paymentMethod: state.selectedPaymentMethod,
            totalPen: totalPen,
            items: state.cart.map((i) => ({ id: i.id, title: i.titulo_producto, qty: i.quantity })),
            restored: false,
            status: 'Enviado a WhatsApp'
          });

          state.cart = [];
          state.isCartOpen = false;
          saveLocal();
          render();
          window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');
        },

        adjustStock(prodId, delta) {
          const p = state.products.find((x) => x.id === prodId);

          p.stock_disponible = Math.max(0, (Number(p.stock_disponible) || 0) + delta);
          saveLocal();
          render();
        },
        toggleManualSoldOut(prodId) {
          const p = state.products.find((x) => x.id === prodId);
          if (!p) return;
          p.modo_agotado = p.modo_agotado === 'manual_agotado' ? 'auto' : 'manual_agotado';

          render();

          render();

        deleteProduct(prodId) {

          render();

        startEditProduct(prodId) {

        saveProductForm(e) {
          e.preventDefault();

          if (!title) return;

          const plat = document.getElementById('pf-plat').value;
          const price = Number(document.getElementById('pf-price').value) || 0;
          const stock = Number(document.getElementById('pf-stock').value) || 0;
          const dur = document.getElementById('pf-dur').value.trim() || '1 Mes';

          const desc = document.getElementById('pf-desc').value;
          const uploadedImg = window.__TEMP_PROD_IMG__ || '';

          if (state.editingProductId) {
            const target = state.products.find((x) => x.id === state.editingProductId);
            if (target) {
              target.titulo_producto = title;
              target.categoria = cat;
              target.plataforma_id = plat;
              target.precio_pen = price;
              target.stock_disponible = stock;
              target.duracion = dur;
              target.tipo_suscripcion = sub;
              target.tipo_entrega = ent;
              target.modo_agotado = modo;
              target.descripcion = desc;
              if (uploadedImg) target.imagen_url = uploadedImg;

            state.editingProductId = null;
            showToast('Producto actualizado.', 'success');
          } else {
            state.products.unshift({
              id: 'prod-' + Date.now(),
              titulo_producto: title,
              categoria: cat,
              plataforma_id: plat,
              proveedor_nombre: state.config.ownerUser,
              precio_pen: price,
              stock_disponible: stock,
              visible: true,
              modo_agotado: modo,
              tipo_suscripcion: sub,
              duracion: dur,
              tipo_entrega: ent,
              ultima_actividad_usuario: '',
              ultima_actividad_texto: 'Sé el primero en comprar',
              horario_proveedor: state.config.scheduleText,
              imagen_url: uploadedImg || createProductCardArt(Date.now(), '#111827', '#1e293b', state.config.primaryColor, ent.toUpperCase(), title.slice(0, 15).toUpperCase(), dur.toUpperCase(), '🦙'),
              descripcion: desc

            showToast('Nuevo producto publicado.', 'success');

          window.__TEMP_PROD_IMG__ = '';
          saveLocal();
          render();
        },
        handleProdFile(input) {
          const file = input.files && input.files[0];
          if (!file) return;
          compressImageFile(file, 480, (b64) => {
            window.__TEMP_PROD_IMG__ = b64;
            showToast('Imagen de producto cargada y optimizada.', 'success');
          });
        },
        togglePlatformVisibility(platId) {
          const pl = state.platforms.find((x) => x.id === platId);

          pl.visible = pl.visible === false ? true : false;

        savePlatformForm(e) {

          const sym = (document.getElementById('plf-sym').value.trim() || name.slice(0, 3)).toUpperCase();

          window.__TEMP_PLAT_IMG__ = '';

          e.preventDefault();

        restoreOrderStock(ordId) {
          const ord = state.ordersHistory.find((o) => o.id === ordId);
          if (!ord || ord.restored) return;
          (ord.items || []).forEach((it) => {
            const p = state.products.find((x) => x.id === it.id);
            if (p) p.stock_disponible = (Number(p.stock_disponible) || 0) + (Number(it.qty) || 1);
          });
          ord.restored = true;
          ord.status = 'Stock Devuelto';
          saveLocal();
          showToast('Stock devuelto al inventario.', 'success');
        }
      };

      function compressImageFile(file, maxDim, cb) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            cb(canvas.toDataURL('image/webp', 0.82));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

          const matchCat = state.selectedCategory === 'Todos' || p.categoria === state.selectedCategory;
          const matchPlat = state.selectedPlatform === 'all' || p.plataforma_id === state.selectedPlatform;
          const q = state.searchQuery.trim().toLowerCase();
          const matchQuery = !q ||
            p.titulo_producto.toLowerCase().includes(q) ||
            p.proveedor_nombre.toLowerCase().includes(q) ||
            p.categoria.toLowerCase().includes(q);
          const matchStock = !state.onlyInStock || !soldOut;
          return matchCat && matchPlat && matchQuery && matchStock;
        });
      }

                </main>
              `}

              <footer class="mt-auto py-4 px-5 pb-20 sm:pb-4 border-t border-zinc-900 text-center text-[11px] text-zinc-500 flex flex-col sm:flex-row items-center justify-between gap-2">
                <div class="font-calc">Copyright © ${new Date().getFullYear()} ${escapeHtml(state.config.storeName)} ${escapeHtml(state.config.storeSubtitle)}. Todos los derechos reservados.</div>
                <div class="font-calc">Horario: Lima (GMT-5)</div>
              </footer>
            </div>
          </div>

          <!-- 3. POPUP / MODAL DE COMPRA DIRECTA (ADAPTADO A MODO CLARO/OSCURO Y CON MARGEN SEGURO EN CELULAR) -->
          ${state.selectedProductModal ? (() => {
            const p = state.selectedProductModal;
            const isOut = isProductSoldOut(p);
            const totalModalPen = (Number(p.precio_pen) * state.modalQuantity).toFixed(2);
            return `
              <div onclick="appActions.closeProductModal()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2.5 pb-10 sm:p-4 overflow-y-auto">
                <div onclick="event.stopPropagation()" class="w-full max-w-4xl rounded-2xl border shadow-2xl overflow-hidden flex flex-col max-h-[84vh] sm:max-h-[90vh] mb-6 sm:mb-0 ${state.darkMode ? 'bg-[#141012] border-[#2c2226] text-zinc-100' : 'bg-white border-slate-200 text-slate-900'}">
                  <div class="px-5 py-3.5 border-b flex items-start justify-between gap-4 ${state.darkMode ? 'border-zinc-800 bg-[#181215]' : 'border-slate-200 bg-slate-50'}">
                    <div>
                      <h2 class="font-calc text-sm sm:text-base font-extrabold uppercase">${escapeHtml(p.titulo_producto)}</h2>
                      <p class="text-[11px] ${textMuted}">${t.modalSubtitle}</p>
                    </div>
                    <button onclick="appActions.closeProductModal()" class="text-lg font-bold px-2">✕</button>
                  </div>

                  <div class="p-4 sm:p-5 overflow-y-auto grid grid-cols-1 md:grid-cols-12 gap-5">
                    <!-- Columna Izquierda: Imagen + Precio + Descripción debajo de la imagen -->
                    <div class="md:col-span-6 space-y-3">
                      <div class="flex flex-wrap items-center gap-1.5 font-calc text-[10px] font-bold">
                        <span class="px-2 py-0.5 rounded border ${state.darkMode ? 'bg-emerald-950 border-emerald-700 text-emerald-300' : 'bg-emerald-100 border-emerald-300 text-emerald-800'}">📦 ${p.stock_disponible} Stock</span>
                        <span style="background-color:${state.config.primaryColor}" class="px-2 py-0.5 rounded text-white">${escapeHtml(p.duracion)}</span>
                        <span class="px-2 py-0.5 rounded border ${state.darkMode ? 'bg-zinc-800 border-zinc-700 text-zinc-200' : 'bg-slate-100 border-slate-300 text-slate-700'}">${escapeHtml(p.tipo_suscripcion)}</span>
                      </div>

                      <div class="relative aspect-square w-full max-h-64 mx-auto rounded-xl overflow-hidden border ${state.darkMode ? 'border-zinc-800 bg-zinc-950' : 'border-slate-200 bg-slate-100'}">
                        <img src="${p.imagen_url}" class="w-full h-full object-cover ${isOut ? 'grayscale contrast-125 brightness-50' : ''}" />
                      </div>

                      <div class="flex items-center justify-between pt-1">
                        <div class="font-num text-xl font-extrabold">👉 S/ ${Number(p.precio_pen).toFixed(2)} <span class="text-xs font-calc ${textMuted}">c/u</span></div>
                        ${!isOut ? `
                          <button onclick="appActions.addToCart('${p.id}', ${state.modalQuantity})" class="px-3 py-1.5 rounded-lg border font-calc text-xs font-bold ${state.darkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-200' : 'bg-slate-100 border-slate-300 text-slate-800'}">
                            🛒 ${t.addToMyCombo}
                          </button>
                        ` : ''}
                      </div>

                      <div class="p-3.5 rounded-xl border space-y-1.5 ${state.darkMode ? 'bg-[#110d0f] border-zinc-800 text-zinc-200' : 'bg-slate-50 border-slate-200 text-slate-800'}">
                        <h4 class="font-calc text-xs font-extrabold text-emerald-500">📋 ${t.rulesTitle}</h4>
                        <div class="text-xs whitespace-pre-line leading-relaxed">${escapeHtml(p.descripcion || '')}</div>
                      </div>
                    </div>

                    <!-- Columna Derecha: Cantidad + Método de Pago + Resumen WhatsApp -->
                    <div class="md:col-span-6 space-y-3.5">
                      <div class="p-3.5 rounded-xl border space-y-3 ${state.darkMode ? 'bg-[#181215] border-zinc-800' : 'bg-slate-50 border-slate-200'}">
                        <div class="flex items-center justify-between">
                          <span class="font-calc text-xs font-extrabold text-emerald-500">🔢 ${t.quantityLabel}</span>
                          <div class="flex items-center gap-2">
                            <button onclick="appActions.changeModalQty(-1)" class="w-7 h-7 rounded font-num font-extrabold ${state.darkMode ? 'bg-zinc-800 text-white' : 'bg-slate-200 text-slate-900'}">-</button>
                            <span class="font-num text-sm font-extrabold text-emerald-500 px-2">${state.modalQuantity} cuenta(s)</span>
                            <button onclick="appActions.changeModalQty(1)" class="w-7 h-7 rounded font-num font-extrabold ${state.darkMode ? 'bg-zinc-800 text-white' : 'bg-slate-200 text-slate-900'}">+</button>
                          </div>
                        </div>
                        <div class="pt-2.5 border-t flex items-center justify-between text-xs ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'}">
                          <span class="font-calc ${textMuted}">${t.unitPriceLabel} S/ ${Number(p.precio_pen).toFixed(2)} x ${state.modalQuantity}</span>
                          <span class="font-num text-lg font-extrabold" style="color:${state.config.primaryColor}">S/ ${totalModalPen}</span>
                        </div>
                      </div>

                      <div class="p-3.5 rounded-xl border space-y-2 ${state.darkMode ? 'bg-[#181215] border-zinc-800' : 'bg-slate-50 border-slate-200'}">
                        <label class="block font-calc text-xs font-extrabold text-emerald-500">💳 ${t.paymentMethodLabel}</label>
                        <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5">
                          ${(state.config.paymentMethods || INITIAL_CONFIG.paymentMethods).map((m) => `
                            <button type="button" onclick="appActions.selectPayment('${escapeHtml(m)}')" class="py-2 px-2 rounded-lg font-calc text-[11px] font-bold border truncate ${state.selectedPaymentMethod === m ? 'bg-emerald-500 text-black border-emerald-400 font-extrabold' : state.darkMode ? 'bg-[#120e10] text-zinc-300 border-zinc-800' : 'bg-white text-slate-700 border-slate-300'}">
                              ${escapeHtml(m)}
                            </button>
                          `).join('')}
                        </div>
                      </div>

                      <div class="p-3.5 rounded-xl border space-y-2 ${state.darkMode ? 'bg-[#181215] border-emerald-500/30' : 'bg-emerald-50/60 border-emerald-300'}">
                        <div class="font-calc text-xs font-extrabold">${t.orderConfirmTitle}</div>
                        <div class="p-2.5 rounded-lg border font-num text-[11px] space-y-1 ${state.darkMode ? 'bg-zinc-950 border-zinc-800 text-zinc-200' : 'bg-white border-slate-200 text-slate-800'}">
                          <div>📦 Producto: <strong>${escapeHtml(p.titulo_producto)}</strong></div>
                          <div>🔢 Cantidad de cuentas: <strong class="text-emerald-500">${state.modalQuantity} cuenta(s)</strong></div>
                          <div>💳 Método de Pago: <strong class="text-sky-500">${escapeHtml(state.selectedPaymentMethod)}</strong></div>
                          <div>💰 Total a Pagar: <strong style="color:${state.config.primaryColor}">S/ ${totalModalPen}</strong></div>
                        </div>
                      </div>

                      <div class="p-3.5 rounded-xl border space-y-2 ${state.darkMode ? 'bg-[#181215] border-zinc-800' : 'bg-slate-50 border-slate-200'}">
                        <div class="font-calc text-xs font-extrabold">🛡 ${t.howItWorksTitle}</div>
                        <ul class="text-[11px] space-y-1 ${textMuted}">
                          <li>${t.step1}</li>
                          <li>${t.step2}</li>
                          <li>${t.step3}</li>
                        </ul>
                      </div>
                    </div>
                  </div>

                  <!-- Pie del Modal con Margen Seguro en Móvil -->
                  <div class="px-4 sm:px-5 pt-3 pb-5 sm:py-3.5 border-t flex items-center justify-center sm:justify-end ${state.darkMode ? 'border-zinc-800 bg-[#110d0f]' : 'border-slate-200 bg-slate-50'}">
                    ${isOut ? `
                      <button onclick="appActions.askRestockWhatsApp('${p.id}')" class="w-full sm:w-auto px-4 py-2.5 rounded-xl font-calc text-xs font-extrabold bg-amber-500 text-black">
                        🔔 ${t.askRestock} por WhatsApp
                      </button>
                    ` : `
                      <button onclick="appActions.confirmDirectOrder('${p.id}')" style="background-color:${state.config.primaryColor}" class="w-full sm:w-auto px-5 py-2.5 rounded-xl font-calc text-xs sm:text-sm font-extrabold text-white shadow-lg">
                        🛒 ${t.confirmOrderBtn} • ${state.modalQuantity} Cuenta(s) • S/ ${totalModalPen} (${escapeHtml(state.selectedPaymentMethod)})
                      </button>
                    `}
                  </div>
                </div>
              </div>
            `;
          })() : ''}

          <!-- 4. DRAWER DEL COMBO CARRITO -->
          ${state.isCartOpen ? `
            <div onclick="appActions.toggleCart(false)" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex justify-end">
              <div onclick="event.stopPropagation()" class="w-full max-w-md border-l h-full flex flex-col justify-between shadow-2xl ${state.darkMode ? 'bg-[#141013] border-zinc-800 text-zinc-100' : 'bg-white border-slate-200 text-slate-900'}">
                <div class="p-4 border-b flex items-center justify-between ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'}">
                  <h3 class="font-calc text-sm font-extrabold">🛒 ${t.comboTitle}</h3>
                  <button onclick="appActions.toggleCart(false)">✕</button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-3">
                  ${state.cart.length === 0 ? `<div class="text-center py-12 text-xs text-zinc-500 font-calc">${t.emptyCombo}</div>` : state.cart.map((item) => `
                    <div class="p-2.5 rounded-xl border flex items-center justify-between gap-2 ${state.darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-slate-50 border-slate-200'}">
                      <div class="flex items-center gap-2 min-w-0">
                        <img src="${item.imagen_url}" class="w-10 h-10 rounded object-cover" />
                        <div class="min-w-0">
                          <div class="font-calc text-xs font-bold truncate">${escapeHtml(item.titulo_producto)}</div>
                          <div class="font-num text-[11px] text-emerald-500 font-bold">S/ ${Number(item.precio_pen).toFixed(2)} c/u</div>
                        </div>
                      </div>
                      <div class="flex items-center gap-1 font-num text-xs">
                        <button onclick="appActions.updateCartQty('${item.id}', -1)" class="w-6 h-6 rounded bg-zinc-800 text-white">-</button>
                        <span class="w-5 text-center font-bold">${item.quantity}</span>
                        <button onclick="appActions.updateCartQty('${item.id}', 1)" class="w-6 h-6 rounded bg-zinc-800 text-white">+</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
                ${state.cart.length > 0 ? `
                  <div class="p-4 border-t space-y-2.5 ${state.darkMode ? 'border-zinc-800' : 'border-slate-200'}">
                    <div class="flex items-center justify-between font-calc">
                      <span class="text-xs">Total a Pagar:</span>
                      <span class="font-num text-base font-extrabold">S/ ${totalPen}</span>
                    </div>
                    <button onclick="appActions.sendComboWhatsApp()" class="w-full py-2.5 rounded-xl bg-emerald-500 text-black font-calc font-extrabold text-xs">
                      💬 ${t.sendWhatsAppOrder} (${escapeHtml(state.selectedPaymentMethod)})
                    </button>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          <!-- 5. LOGIN PRIVADO (SIN MOSTRAR CLAVES AL PÚBLICO) -->
          ${state.isLoginModalOpen ? `
            <div onclick="appActions.closeLoginModal()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div onclick="event.stopPropagation()" class="w-full max-w-sm rounded-2xl bg-[#151114] border border-zinc-800 p-5 space-y-4 text-zinc-100">
                <div class="flex items-center justify-between">
                  <h3 class="font-calc text-sm font-extrabold text-emerald-400">🔒 Acceso Interno Autorizado</h3>
                  <button onclick="appActions.closeLoginModal()">✕</button>
                </div>
                <form onsubmit="appActions.submitLogin(event)" class="space-y-3 text-xs">
                  <div>
                    <label class="block font-calc font-bold text-zinc-300 mb-1">Correo Electrónico</label>
                    <input id="login-email" type="email" required placeholder="Tu correo autorizado" class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-white" />
                  </div>
                  <div>
                    <label class="block font-calc font-bold text-zinc-300 mb-1">Contraseña</label>
                    <input id="login-pass" type="password" required placeholder="••••••••" class="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-700 text-white" />
                  </div>
                  ${state.loginError ? `<div class="text-red-400 font-bold">${escapeHtml(state.loginError)}</div>` : ''}
                  <button type="submit" class="w-full py-2.5 rounded-lg bg-emerald-500 text-black font-calc font-extrabold">Ingresar al Panel</button>
                </form>
              </div>
            </div>
          ` : ''}

          <!-- Botón Flotante Inferior Derecho -->
          <button onclick="appActions.toggleCart(true)" style="background-color:${state.config.primaryColor}" class="fixed bottom-3.5 right-3.5 z-40 px-3.5 py-2 rounded-lg text-white font-calc font-bold text-xs shadow-xl flex items-center gap-1.5">
            <span>🎧 ${totalItems > 0 ? `Combo (${totalItems}) • S/ ${totalPen}` : 'Soporte'}</span>
          </button>
        `;
      }

      render();
    })();
  </script>

</body></html>
