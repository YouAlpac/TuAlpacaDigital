        const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = 'alpaca-contenido-backup.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      };
      window.importBackupJson = function(input){
        const f = input.files && input.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = function(ev){
          try {
            const p = JSON.parse(ev.target.result);
            if(p.config) state.config = Object.assign({}, state.config, p.config);
            if(Array.isArray(p.platforms)) state.platforms = p.platforms;
            if(Array.isArray(p.products)) {
              const ids = new Set(p.products.map(x => x.id));
              state.products = p.products.concat(state.products.filter(x => !ids.has(x.id)));
            }
            saveL(); render();
          } catch(e){}
        };
        r.readAsText(f);
      };
      window.downloadUpdatedIndexHtml = function(){
        const clone = document.documentElement.cloneNode(true);
        clone.querySelector('#app').innerHTML = '';
        const emb = clone.querySelector('#alpaca-embedded-data');
        if(emb){
          const safe = JSON.stringify({ buildStamp:'build-'+Date.now(), config:state.config, platforms:state.platforms, products:state.products, ordersHistory:state.ordersHistory }).replace(/<\//g, '<\\/');
          emb.textContent = 'window.__ALPACA_EMBEDDED_STATE__ = ' + safe + ';';
        }
        const b = new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], {type:'text/html;charset=utf-8'});
        const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = 'index.html'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      };

      window.appActions = {
        setCategory(c){ state.selectedCategory = c; state.activeTab = 'catalogo'; render(); },
        togglePlatform(id){ state.selectedPlatform = state.selectedPlatform === id ? 'all' : id; render(); },
        openModal(id){ state.selectedProductModal = state.products.find(x => x.id === id) || null; state.modalQuantity = 1; render(); },
        closeModal(){ state.selectedProductModal = null; render(); },
        changeQty(d){ if(!state.selectedProductModal) return; const m = Math.max(1, Number(state.selectedProductModal.stock_disponible)||1); state.modalQuantity = Math.min(m, Math.max(1, state.modalQuantity + d)); render(); },
        selectPay(m){ state.selectedPaymentMethod = m; render(); },
        addToCart(id, q){
          const p = state.products.find(x => x.id === id); if(!p || isOut(p)) return;
          const ex = state.cart.find(c => c.id === id);
          if(ex) ex.quantity = Math.min(p.stock_disponible, ex.quantity + (q||1));
          else state.cart.push(Object.assign({}, p, { quantity: Math.min(p.stock_disponible, q||1) }));
          saveL(); render();
        },
        confirmDirect(id){
          const p = state.products.find(x => x.id === id); if(!p || isOut(p)) return;
          const q = state.modalQuantity;
          const tot = (Number(p.precio_pen) * q).toFixed(2);
          p.stock_disponible = Math.max(0, (Number(p.stock_disponible)||0) - q);
          saveL();
          const msg = (state.config.whatsappTemplateSingle || '').replace('{tienda}', state.config.storeName+' '+state.config.storeSubtitle).replace('{producto}', p.titulo_producto).replace('{cantidad}', String(q)).replace(/\{metodo_pago\}/g, state.selectedPaymentMethod).replace('{duracion}', p.duracion).replace('{entrega}', p.tipo_entrega).replace('{total_pen}', tot);
          render();
          window.open('https://wa.me/' + (state.config.whatsappNumber||'').replace(/\D/g,'') + '?text=' + encodeURIComponent(msg), '_blank');
        }
      };

      function render(){
        const t = I18N[state.lang] || I18N.es;
        const cats = (state.config.categoriesList && state.config.categoriesList.length) ? state.config.categoriesList : ['Todos','Streaming','Video','Inteligencia Artificial','Cursos','PDF Digitales','Lifehack'];
        const visPlats = state.platforms.filter(pl => pl.visible !== false);
        const filtered = state.products.filter(p => {
          if(!p || p.visible === false) return false;
          const mc = state.selectedCategory === 'Todos' || p.categoria === state.selectedCategory;
          const mp = state.selectedPlatform === 'all' || p.plataforma_id === state.selectedPlatform;
          const q = (state.searchQuery||'').toLowerCase();
          const mq = !q || (p.titulo_producto||'').toLowerCase().includes(q);
          return mc && mp && mq;
        });

        document.getElementById('app').innerHTML = `
          <div class="min-h-screen flex flex-col md:flex-row bg-[#09090b] text-zinc-100">
            <aside class="w-full md:w-56 border-b md:border-b-0 md:border-r border-zinc-800 p-3 flex flex-col justify-between">
              <div>
                <div class="font-calc text-lg font-extrabold text-emerald-400 pb-3 border-b border-zinc-800">${esc(state.config.storeName)} ${esc(state.config.storeSubtitle)}</div>
                <div class="mt-3 space-y-1 text-xs font-calc">
                  ${cats.map(c => `<button onclick="appActions.setCategory('${esc(c)}')" class="w-full text-left px-2.5 py-1.5 rounded ${state.selectedCategory===c ? 'bg-rose-950 text-white font-bold' : 'text-zinc-400 hover:bg-zinc-900'}">📺 ${esc(c)}</button>`).join('')}
                </div>
              </div>
            </aside>
            <main class="flex-1 p-4 max-w-7xl mx-auto w-full space-y-4">
              <div class="flex flex-wrap gap-1.5">
                ${visPlats.map(pl => `<button onclick="appActions.togglePlatform('${esc(pl.id)}')" title="${esc(pl.name)}" class="w-10 h-10 rounded-lg p-1 border ${state.selectedPlatform===pl.id ? 'border-emerald-500 ring-2 ring-emerald-500' : 'border-zinc-800 bg-[#131114]'}"><img src="${pl.customImage}" class="w-full h-full rounded object-cover" /></button>`).join('')}
              </div>
              <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">
                ${filtered.map(p => {
                  const out = isOut(p);
                  return `
                    <div class="rounded-xl border border-zinc-800 bg-[#151114] overflow-hidden flex flex-col justify-between">
                      <div onclick="appActions.openModal('${esc(p.id)}')" class="cursor-pointer">
                        <div class="relative aspect-square bg-zinc-950 p-1.5">
                          <img src="${p.imagen_url}" class="w-full h-full object-cover rounded-lg ${out ? 'grayscale brightness-50' : ''}" />
                          <span class="font-calc absolute top-2.5 left-2.5 px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-600 text-white">${esc(p.tipo_suscripcion)}</span>
                          <span class="font-calc absolute top-2.5 right-2.5 px-1.5 py-0.5 rounded text-[10px] font-bold text-white" style="background:${state.config.primaryColor}">${esc(p.duracion)}</span>
                        </div>
                        <div class="p-3 space-y-1">
                          <div class="text-[10px] text-zinc-400">${esc(p.proveedor_nombre)}</div>
                          <h3 class="font-calc text-xs font-bold uppercase line-clamp-2">${esc(p.titulo_producto)}</h3>
                          <div class="flex items-center justify-between pt-1">
                            <span class="font-num text-sm font-extrabold">S/ ${Number(p.precio_pen).toFixed(2)}</span>
                            <span class="font-calc text-[10px] px-1.5 py-0.5 rounded ${out ? 'bg-red-600 text-white' : 'bg-emerald-950 text-emerald-300'}">${out ? 'Agotado' : '📦 '+p.stock_disponible+' Stock'}</span>
                          </div>
                        </div>
                      </div>
                      <div class="px-2.5 pb-2.5">
                        <button onclick="appActions.openModal('${esc(p.id)}')" class="w-full py-1.5 rounded-lg border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 font-calc text-[11px] font-bold text-white">${out ? '🔔 Consultar reposición' : 'Comprar / Ver detalles'}</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </main>
          </div>
          ${state.selectedProductModal ? (() => {
            const p = state.selectedProductModal;
            const tot = (Number(p.precio_pen) * state.modalQuantity).toFixed(2);
            return `
              <div onclick="appActions.closeModal()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 overflow-y-auto">
                <div onclick="event.stopPropagation()" class="w-full max-w-4xl rounded-2xl bg-[#141012] border border-zinc-800 overflow-hidden flex flex-col max-h-[88vh]">
                  <div class="px-5 py-3.5 border-b border-zinc-800 flex items-center justify-between">
                    <h2 class="font-calc text-sm sm:text-base font-extrabold uppercase">${esc(p.titulo_producto)}</h2>
                    <button onclick="appActions.closeModal()">✕</button>
                  </div>
                  <div class="p-4 sm:p-5 overflow-y-auto grid grid-cols-1 md:grid-cols-12 gap-5">
                    <div class="md:col-span-6 space-y-3">
                      <div class="aspect-square w-full rounded-xl overflow-hidden border border-zinc-800 bg-zinc-950 flex items-center justify-center">
                        <img src="${p.imagen_url}" class="w-full h-full object-contain" />
                      </div>
                      <div class="font-num text-xl font-extrabold">👉 S/ ${Number(p.precio_pen).toFixed(2)}</div>
                      <div class="p-3.5 rounded-xl border border-zinc-800 bg-[#110d0f] text-xs whitespace-pre-line">${esc(p.descripcion||'')}</div>
                    </div>
                    <div class="md:col-span-6 space-y-3.5">
                      <div class="p-3.5 rounded-xl border border-zinc-800 bg-[#181215] flex items-center justify-between">
                        <span class="font-calc text-xs font-bold text-emerald-400">🔢 Cantidad de Cuentas:</span>
                        <div class="flex items-center gap-2">
                          <button onclick="appActions.changeQty(-1)" class="w-7 h-7 rounded bg-zinc-800">-</button>
                          <span class="font-num text-sm font-extrabold text-emerald-400">${state.modalQuantity}</span>
                          <button onclick="appActions.changeQty(1)" class="w-7 h-7 rounded bg-zinc-800">+</button>
                        </div>
                      </div>
                      <div class="p-3.5 rounded-xl border border-zinc-800 bg-[#181215] space-y-2">
                        <div class="font-calc text-xs font-bold text-emerald-400">💳 Método de Pago:</div>
                        <div class="grid grid-cols-3 gap-1.5">
                          ${(state.config.paymentMethods||['Yape','Plin','BCP','Interbank','Binance Pay (USDT)']).map(m => `<button onclick="appActions.selectPay('${esc(m)}')" class="py-1.5 px-2 rounded border text-[11px] font-calc font-bold ${state.selectedPaymentMethod===m ? 'bg-emerald-500 text-black border-emerald-400' : 'bg-zinc-900 border-zinc-800 text-zinc-300'}">${esc(m)}</button>`).join('')}
                        </div>
                      </div>
                      <button onclick="appActions.confirmDirect('${esc(p.id)}')" style="background:${state.config.primaryColor}" class="w-full py-3 rounded-xl font-calc text-xs sm:text-sm font-extrabold text-white shadow-lg">
                        🛒 Confirmar Pedido • ${state.modalQuantity} Cuenta(s) • S/ ${tot} (${esc(state.selectedPaymentMethod)})
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          })() : ''}
        `;
      }
      render();
    })();
  </script>
</body>
</html>
